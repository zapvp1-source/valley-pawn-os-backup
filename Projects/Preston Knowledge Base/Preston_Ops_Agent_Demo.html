  --bg:#1A1D21; --rail:#121619; --rail-ink:#AEB8BF; --rail-active:#2F6B5E; --ink:#D1D2D3; --muted:#9A9B9C; --line:#33363B;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.46}
button,input{font:inherit;color:inherit}

.ws{height:100%;display:grid;grid-template-columns:220px minmax(0,1fr) 330px}

.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding-block:14px 12px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;gap:4px;min-height:0}

.ask .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--muted)}

  .asks{display:flex;border-top:1px solid var(--line)}

o try and make $1100-1200?", "conflict": "", "correction": "", "note": "", "id": "bullion-margin-check-11eb04c9", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-03-09", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1773077778052079"}, {"tier": "MEDIUM", "topic": "melt-vs-retail-decision", "section": "PRECIOUS METALS - MELT MATH & PAY PERCENTAGES", "rule": "White gold chains are \"super slow movers\" and Preston's default is to melt them for a quick turnaround rather than retail them.", "said": "I had talked to this guy a few weeks ago and had gone back and forth on the price we could pay. He had walked originally. I think this is something we would just melt for a quick turn around because white gold chains are super slow movers. I'm okay with the deal if you are able to fund it Josh.", "conflict": "", "correction": "", "note": "", "id": "melt-vs-retail-decision-98691922", "where": "#harrisonburg-funds (C03BWRKEDUZ)", "date": "2026-01-02", "url": "https://valleypawnworkspace.slack.com/archives/C03BWRKEDUZ/p1767379817341119"}, {"tier": "MEDIUM", "topic": "pay-percentage-ceiling-melt", "section": "PRECIOUS METALS - MELT MATH & PAY PERCENTAGES", "rule": "Preston treats 90% of melt as above what Valley Pawn should pay; on the same item 80% of melt was the amount he was weighing.", "said": "Somewhat depends on what it is, the $102 amount is 80% $123 is 90% which is more than I think we should pay. Melt is 144.85 currently", "conflict": "", "correction": "", "note": "", "id": "pay-percentage-ceiling-melt-bc0070ec", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-08-09", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1786254459387499"}, {"tier": "MEDIUM", "topic": "pay-percentage-gold-in-falling-market", "section": "PRECIOUS METALS - MELT MATH & PAY PERCENTAGES", "rule": "On a sharply falling gold morning Preston advised capping the pay rate at no more than 65-70% (of the estimator/melt basis in use at that time) and asked Joshua to confirm.", "said": "Gold is off to a big drop again this morning. I'd advise no more than 65-70% rate on it. Thoughts Josh?", "conflict": "This 65-70% figure sits well above the 50-55% estimator settings and the 50%-of-melt public calculator. In the same thread Joshua answered separately for bullion (\"On bullion 50 percent of current spot\"). Capture both; do not reconcile.", "correction": "", "note": "", "id": "pay-percentage-gold-in-falli-30f5e75e", "where": "#general (C03BETSS669)", "date": "2026-02-02", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1770045268505639"}, {"tier": "MEDIUM", "topic": "spot-price-falling-action", "section": "PRECIOUS METALS - MELT MATH & PAY PERCENTAGES", "rule": "On a mild down day the instruction is to stay aware of direction and make good buy/sell choices accordingly.", "said": "Gold and silver are both down a little today. Make sure we stay in tune with the direction they are headed and make good choices selling/buying.", "conflict": "", "correction": "", "note": "", "id": "spot-price-falling-action-dc9d64b3", "where": "#general (C03BETSS669)", "date": "2025-10-27", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1761579035233579"}, {"tier": "LOW", "topic": "bullion-retail-pricing", "section": "PRECIOUS METALS - MELT MATH & PAY PERCENTAGES", "rule": "Preston's benchmark question when a store proposes a bullion sale price is whether it is $10 over spot per ounce.", "said": "Is it $10 over spot per ounce?", "conflict": "", "correction": "", "note": "", "id": "bullion-retail-pricing-553c61be", "where": "Group DM (C0AC00M8SNP)", "date": "2026-01-31", "url": "https://valleypawnworkspace.slack.com/archives/C0AC00M8SNP/p1769873957963609"}, {"tier": "LOW", "topic": "gold-coin-buy-decision", "section": "PRECIOUS METALS - MELT MATH & PAY PERCENTAGES", "rule": "Live example of Preston's gold-coin buy math — 5 half-ounce gold coins, customer wanted more than $10,000, melt around $11,000 (i.e. an offer at roughly 91% of melt, which Preston questioned).", "said": "He was looking for a better offer than $10,000 for the 5. Melt is right around 11k", "conflict": "", "correction": "", "note": "", "id": "gold-coin-buy-decision-2fb830d0", "where": "#general (C03BETSS669)", "date": "2026-09-05", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1788645423935689"}, {"tier": "LOW", "topic": "melt-large-stone-rings", "section": "PRECIOUS METALS - MELT MATH & PAY PERCENTAGES", "rule": "Don't pay melt value on the full weight of a ring with a large stone, because the stone's weight is unknown and inflates the figure. Offer to have the stone popped out so the metal can be weighed and paid on separately. The speaker is not identified as Preston or a manager, so treat this as one person's call on one deal.", "said": "I can't do that on these stone deals. I mean, unless they want to pop the stone out and then we can weigh it and pay on that, but there's no way to know.", "conflict": "", "correction": "", "note": "", "id": "melt-large-stone-rings-e6d660b7", "where": "zoom-call:1f8cdc6567324a809215c80a260fd5fc", "date": "2026-10-12", "url": ""}, {"tier": "VERIFIED", "topic": "testing-equipment-kee-discontinued", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "The Kee gold testers Valley Pawn uses were discontinued; Preston's plan is to stock a couple of pens per store while still available, then find a replacement or fall back to acid only.", "said": "FYI. The kee gold testers that we use. They were discontinued. We may want to get a couple of pens for each store while they are out there and then we will need to look for another option or just go back to acid only.", "conflict": "", "correction": "(2026-10-09): We still use the Kee tester at the stores. Testing order stays: magnet first, sort by markings, then confirm with the Kee and acid. Coins and bullion: magnet, weight and Sigma (the Kee is not reliable on bars). (Joshua, 2026-10-09)", "note": "", "id": "testing-equipment-kee-discon-9b5b53ce", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-05-28", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1779972778229139"}, {"tier": "HIGH", "topic": "coins-testing-required", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Preston audits gold coin intakes retrospectively and asks how they were tested.", "said": "3 gold coins - how did we test? Are we sure they are good?", "conflict": "", "correction": "", "note": "", "id": "coins-testing-required-dd88e56b", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2023-11-09", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1699540200762619"}, {"tier": "HIGH", "topic": "fraud-detection-acre-bars", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "ACRE-brand small gold bars (2.5g) are a known counterfeit target — Preston has personally seen fakes of that brand and flags any ACRE intake for re-testing and \"weird readings.\"", "said": "ACRE 2.5g gold bars - Did these test good with no weird readings? Have seen fakes of this brand.", "conflict": "", "correction": "", "note": "", "id": "fraud-detection-acre-bars-7d65d8f6", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2023-11-09", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1699540200762619"}, {"tier": "HIGH", "topic": "fraud-detection-bars-kee-unreliable", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "The Kee tester is NOT reliable on bullion bars — that is specifically why Valley Pawn owns the Sigma. Magnet is always the first test. In the incident that produced this rule, gold bars passed the Kee but failed magnet and Sigma and were fake.", "said": "Magnet should be first test. Kee is not reliable on bars which is why we have the Sigma.", "conflict": "", "correction": "", "note": "", "id": "fraud-detection-bars-kee-unr-48beda67", "where": "#boro-funds (C03BLLRN64U)", "date": "2024-05-17", "url": "https://valleypawnworkspace.slack.com/archives/C03BLLRN64U/p1715971599032509"}, {"tier": "HIGH", "topic": "fraud-detection-bars-test-order", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Preston's checklist for bullion bars, given on the spot when a $6,000 gold bar deal came in: Sigma, magnet, weight.", "said": "Sigma, magnet, weight", "conflict": "", "correction": "", "note": "", "id": "fraud-detection-bars-test-or-f6a4f89f", "where": "#boro-funds (C03BLLRN64U)", "date": "2024-05-17", "url": "https://valleypawnworkspace.slack.com/archives/C03BLLRN64U/p1715970633300419"}, {"tier": "HIGH", "topic": "fraud-detection-coin-silver-markings", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "On silver flatware Preston requires the markings be checked for \"coin silver\" (not sterling) and a Sigma test before the lot is valued.", "said": "Silver flatware 161.50dwt - Are these marked for coin silver? Did they test on the sigma?", "conflict": "", "correction": "", "note": "", "id": "fraud-detection-coin-silver--37ee5e27", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2023-12-19", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1702996200144299"}, {"tier": "HIGH", "topic": "fraud-detection-gas-station-gold", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Preston uses a visual tell he calls \"gas station gold\" — pieces whose appearance resembles cheap fake jewelry sold at gas stations — and requires 100% clean testing before a buy on anything that looks like it.", "said": "14k gold mens ring 7.4 dwt - $220 - Did this test 100% good? Kind of resembles the look of some \"gas station gold\" pieces. Just want to make sure!", "conflict": "", "correction": "", "note": "", "id": "fraud-detection-gas-station--ee6fe774", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2023-10-30", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1698672601910159"}, {"tier": "HIGH", "topic": "fraud-detection-photo-mismatch", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Preston flags gold scrap where the photo \"looks weird\" and asks specifically whether the magnet check was done.", "said": "16.1dwt 14k gold scrap - $465- Not sure why this looks a little weird in the photo. Did we check these with magnet?", "conflict": "", "correction": "", "note": "", "id": "fraud-detection-photo-mismat-01dabb8f", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2023-12-19", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1702996200144299"}, {"tier": "HIGH", "topic": "fraud-detection-silverware-sets", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Preston's standard questions before approving a silver flatware/set deal: photos of the markings, whether knives are included (knife handles are weighted/filled), and whether it was Sigma tested.", "said": "Can you send me photos of the markings of the set? Does this include knives? Did we test with the sigma tester?", "conflict": "", "correction": "", "note": "", "id": "fraud-detection-silverware-s-8610bbe8", "where": "#lex-funds (C03B3K5DL6T)", "date": "2026-02-19", "url": "https://valleypawnworkspace.slack.com/archives/C03B3K5DL6T/p1771521071763809"}, {"tier": "HIGH", "topic": "fraud-detection-write-off-fake-gold", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Fake gold that got through testing shows up in the annual write-off. In the Nov 2024 write-off, fake gold losses were: Lexington $447, Roanoke $120, Harrisonburg $206.69 — plus separate \"missing gold\" of Culpeper $826.86, Lexington $483, Waynesboro $538.70, Harrisonburg $554.94.", "said": "Lexington \nBroken - $1,602.07 ($447 fake gold)\nMissing - $1,928.29 ($483 missing gold)", "conflict": "", "correction": "", "note": "", "id": "fraud-detection-write-off-fa-a270d13d", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2024-11-15", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1731684118329529"}, {"tier": "HIGH", "topic": "testing-equipment-security", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Diamond tester, gold tester and bullion tester must be secured in a designated labeled spot when not in use — never left on the counter.", "said": "Our testing equipment (diamond tester, gold tester, bullion tester) are to always be kept secured when not in use. These are valuable tools to our business. Do not leave them on counters where they can be taken or misplaced. You should have a designated area that these items are kept when not in use. If you do not have one already then make one and label it.", "conflict": "", "correction": "", "note": "", "id": "testing-equipment-security-943cbe52", "where": "#general (C03BETSS669)", "date": "2025-10-28", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1761665722649009"}, {"tier": "HIGH", "topic": "testing-protocol-precious-metals", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Standing company testing protocol: magnet test FIRST on any precious metal. Jewelry that passes the magnet gets sorted by markings, then confirmed with the Kee tester and acid. All coins and bullion must be tested by magnet, weight, AND sigma tester.", "said": "Hey everyone. First thing we should be doing to test precious metals of any type is a magnet test.\n\nAnything jewelry that passes the magnet test you want to look at markings and sort, then use the kee tester and acid tests to confirm what is marked.\n\nAll coins and bullion need to be tested by magnet, weight, and sigma tester.", "conflict": "", "correction": "", "note": "", "id": "testing-protocol-precious-me-6f888d88", "where": "#general (C03BETSS669)", "date": "2024-05-17", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1715975067236279"}, {"tier": "MEDIUM", "topic": "coins-testing-required", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Gold coins must be tested with the tester even when the store \"normally just goes off gold weight\"; Preston pushes back on weight-only valuation of unfamiliar foreign gold coins.", "said": "It's 1/2 ounce of gold. Need to use the tester", "conflict": "", "correction": "", "note": "", "id": "coins-testing-required-c673f288", "where": "#deal-questions (C03BWGT5F5X)", "date": "2025-10-21", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1761077613942169"}, {"tier": "MEDIUM", "topic": "fraud-detection-purity-claim", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Preston challenges implausible purity write-ups — e.g. a chain written up as S999 pure silver, and silver-priced items too expensive to be only silver.", "said": "Chain S999 1.7 dwt - $1 - Written up as pure silver. Is this accurate?", "conflict": "", "correction": "", "note": "", "id": "fraud-detection-purity-claim-4c2b2dd0", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2023-10-30", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1698672601910159"}, {"tier": "MEDIUM", "topic": "ram-testing-before-buying", "section": "PRECIOUS METALS - TESTING, FRAUD & COUNTERFEITS", "rule": "Only buy RAM in if you can install it in a gaming PC at the store and test it. If you can't test it, don't take it in.", "said": "If you have a gaming pc there you should be able to install them and test. Otherwise I wouldn't take them in.", "conflict": "", "correction": "", "note": "", "id": "ram-testing-before-buying-00ee62d3", "where": "#deal-questions (Preston Peters, Operations Manager)", "date": "2026-10-15", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1792101122579589"}, {"tier": "HIGH", "topic": "bravo-stone-weight-estimation", "section": "DIAMONDS, GEMSTONES & COLORED STONES", "rule": "Bravo estimates and breaks out stone weight from total weight; that breakdown is what makes the \"with stones\" bucket workable. Outside tools that value colored-stone jewelry off total weight overstate value.", "said": "It's also not taking into account the colored stone weight vs the gold weight (the weight is altogether) bravo breaks down that difference to account for the stone weight in the system.", "conflict": "", "correction": "", "note": "", "id": "bravo-stone-weight-estimatio-fab0f465", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-04-02", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1743609778643499"}, {"tier": "HIGH", "topic": "scrap-buckets-stones-vs-no-stones", "section": "DIAMONDS, GEMSTONES & COLORED STONES", "rule": "Every store runs two scrap gold buckets each month — one \"gold with stones\" and one \"gold no stones\" — and weights are reported to Preston split that way.", "said": "There will be one for stones and one for no stones.", "conflict": "", "correction": "", "note": "", "id": "scrap-buckets-stones-vs-no-s-cf05f7be", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-07-16", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1784212947966109"}, {"tier": "HIGH", "topic": "stones-excluded-from-gold-weight", "section": "DIAMONDS, GEMSTONES & COLORED STONES", "rule": "Stone weight must be accounted for and subtracted from gold weight before valuing a piece; Valley Pawn should pay only the gold estimation value on scrap rings, not the estimator value that includes diamonds.", "said": "Scrap mens gold ring with diamonds (Missing 6 diamonds) - $285 - We should not be factoring in diamond value on scrap rings like this when buying them. We only should pay for the gold estimation value and not the full estimator value that includes the value of the diamonds.", "conflict": "", "correction": "", "note": "", "id": "stones-excluded-from-gold-we-27770333", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2024-02-26", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1708957801822929"}, {"tier": "HIGH", "topic": "stones-excluded-from-gold-weight", "section": "DIAMONDS, GEMSTONES & COLORED STONES", "rule": "Preston's standing challenge question on any stone-set gold buy: were all stones accounted for and subtracted from the gold weight, and were magnetic clasps weighed out.", "said": "Local customer? New customer? Are all stones accounted for and subtracted from the gold weight? Those are big stones.", "conflict": "", "correction": "", "note": "", "id": "stones-excluded-from-gold-we-eca5df14", "where": "#roanoke-funds (C063K8E02TW)", "date": "2025-08-18", "url": "https://valleypawnworkspace.slack.com/archives/C063K8E02TW/p1755532916859679"}, {"tier": "HIGH", "topic": "stones-excluded-from-gold-weight", "section": "DIAMONDS, GEMSTONES & COLORED STONES", "rule": "Clasps and other non-gold hardware must be weighed out too.", "said": "Did we weigh with the magnetic clasps? Account for stones?", "conflict": "", "correction": "", "note": "", "id": "stones-excluded-from-gold-we-e0ba5537", "where": "#roanoke-funds (C063K8E02TW)", "date": "2025-07-10", "url": "https://valleypawnworkspace.slack.com/archives/C063K8E02TW/p1752161271308959"}, {"tier": "MEDIUM", "topic": "return-verify-stone-not-swapped", "section": "DIAMONDS, GEMSTONES & COLORED STONES", "rule": "Before accepting a returned ring for a refund or exchange, confirm the stone is still the original stone and that nothing was switched or altered.", "said": "We also need to make sure that the stones still the right stone Nothing got switched or altered or anything like that", "conflict": "", "correction": "", "note": "", "id": "return-verify-stone-not-swap-a2ed3b98", "where": "zoom-call:7c3ee07fd0d14649a7f242b8fe7599b0", "date": "2026-10-20", "url": ""}, {"tier": "HIGH", "topic": "aged-jewelry-scrap-trigger", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "2024-01 policy: jewelry over 1 year is separated as clearance and marked down 30% off the Bravo estimator price (firm), and scrapped at 2 years.", "said": "All jewelry over 1 year old is to be separated from other jewelry in a very clear manner and marked as clearance.\n\nPrices are to be marked down on the tag (change the price) by 30% from the Bravo estimator price. This is the clearance price and the price is FIRM.\n\nOnce 2 years of age, this jewelry is to be scrapped.", "conflict": "Superseded twice — see the two entries below. All three thresholds (2 yr, 1 yr + 6 mo, 1.5 yr) exist in Preston's own words at different dates.", "correction": "", "note": "", "id": "aged-jewelry-scrap-trigger-e74402f6", "where": "#general (C03BETSS669)", "date": "2024-01-03", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1704290400624789"}, {"tier": "HIGH", "topic": "aged-jewelry-scrap-trigger", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "2024-07 policy: jewelry marked down 30% once aged over 1 year, moved to clearance for 6 months, then scrapped if unsold; completed no later than the 15th of each month. Jewelry markdowns do NOT compound (unlike general merchandise at 25%/month).", "said": "Jewelry will be marked down 30% once it is aged over 1 year and will be moved to clearance for 6 months and then scrapped if it does not sell. This is to be completed no later than the 15th of each month.\n\nJewelry is not going to be compoundly marked down. Only mark down new jewelry items each month and move them to clearance.", "conflict": "See the 2-year and 1.5-year versions.", "correction": "", "note": "", "id": "aged-jewelry-scrap-trigger-15acbe7a", "where": "#policy-announcements (C03BHQ9RLR0)", "date": "2024-07-13", "url": "https://valleypawnworkspace.slack.com/archives/C03BHQ9RLR0/p1720877387354809"}, {"tier": "HIGH", "topic": "aged-jewelry-scrap-trigger", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "Operating rule as Preston enforces it in 2025-2026: all jewelry over 1.5 years old is to be scrapped each month.", "said": "Reminder to everyone, all jewelry over 1.5 years old is to be scrapped each month", "conflict": "Coexists with the 2-year (2024-01) and 1-year-plus-6-months (2024-07) statements above.", "correction": "", "note": "", "id": "aged-jewelry-scrap-trigger-d46cedeb", "where": "#aged-inventory-review (C04NGH4FF35)", "date": "2025-03-22", "url": "https://valleypawnworkspace.slack.com/archives/C04NGH4FF35/p1742665149906479"}, {"tier": "HIGH", "topic": "aged-jewelry-scrap-trigger", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "Preston reads low aged-jewelry percentages as evidence a store is scrapping before the 1.5-year mark, and audits that stores are actually scrapping aged jewelry monthly.", "said": "Waynesboro jewelry looks to be in a great spot. Indicates good management or scrapping items before the 1.5 year mark. – Roanoke has highest jewelry percent, ensure clearance has its own section and easily identifiable from other jewelry. Verify all aged items over 1.5 years are getting scrapped each month.", "conflict": "", "correction": "", "note": "", "id": "aged-jewelry-scrap-trigger-3f1850f7", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-05-11", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1778509712947879"}, {"tier": "HIGH", "topic": "silver-jewelry-vs-flatware-yield", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "Silver JEWELRY lots yield materially below full melt because of stones and non-silver content; Preston expected a lot with ~$10,700 full melt to settle over $8k. Flatware lots are cleaner and were shipped first.", "said": "Sending the last of the silver. I don't think it will be a big haul, this is all the jewelry stuff rather than the flatware like I've been sending. Not a full load either. Full melt based on their pay rate is around $10,700 but there is lots of stones and stuff so hopefully it will be over 8k by the time everything is said and done.", "conflict": "", "correction": "", "note": "", "id": "silver-jewelry-vs-flatware-y-03de64bc", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-17", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1781719609512879"}, {"tier": "MEDIUM", "topic": "employee-jewelry-policy", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "Employees must not wear company (inventory) jewelry. Personal jewelry limits under the handbook are still open for discussion at the November 4th meeting, and the handbook applies until changed.", "said": "I think the main thing is make sure you're not wearing the company's jewelry and there's no reason to wear that.", "conflict": "", "correction": "", "note": "", "id": "employee-jewelry-policy-9813e249", "where": "zoom-call:38fd73720bb342aeb12f016ed0618017", "date": "2026-10-12", "url": ""}, {"tier": "MEDIUM", "topic": "gold-case-watch-valuation", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "For a solid-gold-cased watch of unknown gold content, Preston estimates 15% of the entire watch weight is gold, uses that to compute melt, and loans off that. If the customer wants more, the watch has to be broken apart and the gold weighed alone.", "said": "Estimating 15% of the entire watch is gold weight.", "conflict": "", "correction": "", "note": "", "id": "gold-case-watch-valuation-c8993289", "where": "#deal-questions (C03BWGT5F5X)", "date": "2026-06-11", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1781195537315829"}, {"tier": "MEDIUM", "topic": "gold-case-watch-valuation", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "On the same deal: a fashion-brand watch has no horological value; the loan is justified only by the gold in the case, which must be heavily tested. He loaned $200 as it sat against a computed ~$450 melt.", "said": "If it's solid gold case then it's good to do the loan. The watch itself is not gonna be worth money. Need to heavily test the gold.", "conflict": "", "correction": "", "note": "", "id": "gold-case-watch-valuation-b24fcd9e", "where": "#deal-questions (C03BWGT5F5X)", "date": "2026-06-11", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1781195082144599"}, {"tier": "MEDIUM", "topic": "silver-jewelry-price-sanity-check", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "Preston flags silver jewelry buys that are too expensive per dwt to plausibly be silver only.", "said": "10.4dwt silver bracelet - $55- Does this have gold as well? Very high amount for just silver.", "conflict": "", "correction": "", "note": "", "id": "silver-jewelry-price-sanity--b60ded50", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2023-10-12", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1697117400541019"}, {"tier": "LOW", "topic": "jewelry-count-discrepancy-recount-first", "section": "JEWELRY, WATCHES & CASE OPERATIONS", "rule": "When the jewelry count comes up short, recount first and then widen to a full audit. The transcript is garbled, so the exact wording (\"don't check\" vs. \"do a recount\") is uncertain.", "said": "Just don't check your counts first and then we can expand from there", "conflict": "", "correction": "", "note": "", "id": "jewelry-count-discrepancy-re-9c583679", "where": "zoom-call:7264764ec053483c8e050dd3398fdd16", "date": "2026-10-19", "url": ""}, {"tier": "HIGH", "topic": "assay-variance-by-store", "section": "SCRAP, BUCKETS & REFINING", "rule": "Bravo's per-store assay estimate differs from the refiner's whole-lot averaged assay, so one store's stone-scrap will come in above Bravo's estimate and another store's below. This is expected, not an error.", "said": "So it looks like it was done correctly based on what split was calculated. The stone scrap came in higher than what bravo estimated though. This is likely due to Roanoke bravo assay estimate being lower than what the total averaged out to be from the refinery. It will show other stores lower than estimated by bravo somewhere.", "conflict": "", "correction": "", "note": "", "id": "assay-variance-by-store-eba701ce", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-08-05", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1785964182957659"}, {"tier": "HIGH", "topic": "bravo-scrap-category-rule", "section": "SCRAP, BUCKETS & REFINING", "rule": "In Bravo the \"Scrap\" jewelry category may only be used for items NOT going out for sale; \"miscellaneous jewelry\" must never be used. Sales-floor jewelry is limited to pendants, charms, brooches, chains, necklaces, rings, earrings, bracelets.", "said": "Scrap category should only be used if it is not going out for sale, miscellaneous jewelry should never be used.", "conflict": "", "correction": "", "note": "", "id": "bravo-scrap-category-rule-c1d06329", "where": "#preston-claude (C0BGXSTT4TY)", "date": "2026-08-14", "url": "https://valleypawnworkspace.slack.com/archives/C0BGXSTT4TY/p1786713377559199"}, {"tier": "HIGH", "topic": "scrap-acquisition-coaching", "section": "SCRAP, BUCKETS & REFINING", "rule": "Preston's standing sales-floor direction is that gold is one of the categories to actively ask every customer about, and that scrap gold is a monthly milestone goal each store sets a target for.", "said": "Both gold and silver are on the upswing. Make sure we are talking about it! We want all the scrap we can get!", "conflict": "", "correction": "", "note": "", "id": "scrap-acquisition-coaching-b8e664bb", "where": "#general (C03BETSS669)", "date": "2026-08-11", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1786458666386929"}, {"tier": "HIGH", "topic": "scrap-acquisition-coaching", "section": "SCRAP, BUCKETS & REFINING", "rule": "In the \"Keys to Success\" training doc Preston lists what to ask customers for, with gold (broken or resellable), jewelry and coins near the top, and sets \"Scrap gold (set target)\" as a monthly milestone goal.", "said": "Ask if the customer has other items. Tell them what we pay the most for. This leads to getting quality merchandise and directing the flow of what we take in.\n    ◦ Guns\n    ◦ Gold\n        ▪︎ Broken or resellable!\n    ◦ Jewelry\n    ◦ Coins", "conflict": "", "correction": "", "note": "", "id": "scrap-acquisition-coaching-a232b643", "where": "#general (C03BETSS669)", "date": "2023-12-18", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1702908015893249"}, {"tier": "HIGH", "topic": "scrap-bucket-closeout-85-percent", "section": "SCRAP, BUCKETS & REFINING", "rule": "Scrap buckets are closed out in Bravo at 85% (an 85%-of-value reduction applied at closeout). Preston re-confirms this rate before any automated closeout run.", "said": "Okay. Make sure it is careful doing it. Once it's finalized it can't be undone. Are we still doing the 85% on closeout?", "conflict": "", "correction": "", "note": "", "id": "scrap-bucket-closeout-85-per-3d98b904", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-08-05", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1785937151393149"}, {"tier": "HIGH", "topic": "scrap-bucket-closeout-85-percent", "section": "SCRAP, BUCKETS & REFINING", "rule": "Worked May 2026 closeout showing the 85% reduction and the spot prices captured at bucket close.", "said": "Total in Bravo @85% -  $62,537.37\n\nTotal @ 100% - $73,573.37\n\nGold in bravo for May - $49,041.39 / 57,695.75 (before reduction)\n\nSilver in bravo for May - $13,495.98 / 15,877.62 (before reduction)\n\nGold market when bucket closed $4,714.40/oz\nSilver market when bucket closed $86.71/oz", "conflict": "", "correction": "", "note": "", "id": "scrap-bucket-closeout-85-per-e466d984", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-16", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1781627330305109"}, {"tier": "HIGH", "topic": "scrap-bucket-date-convention", "section": "SCRAP, BUCKETS & REFINING", "rule": "On a closed scrap bucket, the close date is the month the revenue posted in Bravo; the gold itself was acquired in the month prior to that date. Bucket titles are not a reliable basis for totalling.", "said": "I saw him trying to total the buckets based on title. On the buckets that are already closed, there is a date they were closed. That is the month they were posted in bravo for revenue, previous month to that date is the month the gold was acquired from.", "conflict": "", "correction": "", "note": "", "id": "scrap-bucket-date-convention-3f6b984b", "where": "#scrap-rankings (C05EHBH4G67)", "date": "2026-08-05", "url": "https://valleypawnworkspace.slack.com/archives/C05EHBH4G67/p1785937697424619"}, {"tier": "HIGH", "topic": "scrap-buckets-where-dwt-lives", "section": "SCRAP, BUCKETS & REFINING", "rule": "Store gold weight is pulled from closed scrap buckets in Bravo; the dwt shows on the top left of each opened bucket and the two buckets must be added for a store total.", "said": "1. It is under the inventory tab from the Home Screen.\n2. The dwt is on the top left in each bucket that you open to view. You have to repeat the process for each bucket to open them. Add both together for the stores total.", "conflict": "", "correction": "", "note": "", "id": "scrap-buckets-where-dwt-live-9e0d0780", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-07-16", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1784215953103649"}, {"tier": "HIGH", "topic": "scrap-intake-baseline-2024", "section": "SCRAP, BUCKETS & REFINING", "rule": "2024 full-year scrap gold intake by store, per Preston: Culpeper 1,213.51 dwt, Waynesboro 1,015.02 dwt, Harrisonburg 859.20 dwt, Lexington 526.70 dwt, Roanoke 316.92 dwt.", "said": "Culpeper gold\n2024 - 1,213.51 dwt\n\nHarrisonburg gold \n2024 - 859.20 dwt\n\nWaynesboro gold \n2024 - 1,015.02 dwt\n\nLexington gold \n2024 - 526.70 dwt\n\nRoanoke gold \n2024 - 316.92 dwt", "conflict": "", "correction": "", "note": "", "id": "scrap-intake-baseline-2024-49a12022", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-02-08", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1739044192951529"}, {"tier": "HIGH", "topic": "scrap-intake-targets-dwt", "section": "SCRAP, BUCKETS & REFINING", "rule": "Preston's stated minimum scrap gold intake per store is 60 dwt/month (≈$21k/month company-wide at 2025 prices); 80 dwt/store/month would be ≈$28k/month and 960 dwt/store/year, which only Waynesboro and Culpeper beat in 2024. He warned against over-scrapping just to hit a number.", "said": "I would say 60dwt would be minimum we would want to see? If all 5 stores do that we would be getting 21k a month minimum.", "conflict": "", "correction": "", "note": "", "id": "scrap-intake-targets-dwt-b2b7af47", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-02-09", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1739132842259889"}, {"tier": "HIGH", "topic": "scrap-intake-targets-dwt", "section": "SCRAP, BUCKETS & REFINING", "rule": "The 80 dwt version of the target, with the annual math and the over-scrapping caveat.", "said": "If we did 80dwt that would be around 28k a month if all stores did that. Total dwt for the year would be 960 which only boro and Culpeper did better. At 60 minimum it would be 720dwt average.", "conflict": "", "correction": "", "note": "", "id": "scrap-intake-targets-dwt-62774488", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-02-09", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1739133143752249"}, {"tier": "HIGH", "topic": "scrap-intake-targets-dwt", "section": "SCRAP, BUCKETS & REFINING", "rule": "Preston's caution that a dwt-based bonus qualifier invites over-scrapping, and that the only control he knows of is manual review.", "said": "Maybe it's 80dwt if we are talking about bonus. Just have to make sure we are not over scrapping just to get the number…", "conflict": "", "correction": "", "note": "", "id": "scrap-intake-targets-dwt-7aa85115", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-02-09", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1739133227427869"}, {"tier": "HIGH", "topic": "scrap-intake-targets-dwt", "section": "SCRAP, BUCKETS & REFINING", "rule": "As of July 2026 the gold dwt bonus qualifier was changed to 100 dwt.", "said": "Yes with the exception to the dwt gold change to 100.", "conflict": "Supersedes the earlier 60/80 dwt figures; capture all three.", "correction": "", "note": "", "id": "scrap-intake-targets-dwt-0c505d3c", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-07-16", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1784212441918469"}, {"tier": "HIGH", "topic": "scrap-lot-karat-mix", "section": "SCRAP, BUCKETS & REFINING", "rule": "Harrisonburg's scrap regularly contains 18k, 21k and 22k material, which is why a lot's melt value can look high relative to its dwt.", "said": "Gold stones - 187dwt\nGold no stones - 189dwt\n\nApproximately 30k melt value, there is a good bit of 18k, 21k and 22k stuff from Harrisonburg if he thinks the amount is high for weight.", "conflict": "", "correction": "", "note": "", "id": "scrap-lot-karat-mix-dd2b1c22", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-03-08", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1741457097048059"}, {"tier": "HIGH", "topic": "scrap-pickup-cadence", "section": "SCRAP, BUCKETS & REFINING", "rule": "Preston physically picks up scrap from the stores monthly, and stores must DM him their gold weights split stones/no-stones.", "said": "I will be picking up gold on 6/3/2025 from stores. Please have this ready to pick up and send me the weights for stones and no stones directly.", "conflict": "", "correction": "", "note": "", "id": "scrap-pickup-cadence-73192077", "where": "#general (C03BETSS669)", "date": "2025-05-15", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1747322057176999"}, {"tier": "HIGH", "topic": "scrap-refining-process-sop", "section": "SCRAP, BUCKETS & REFINING", "rule": "Preston's step-by-step Bravo scrap refining SOP: Inventory > Scrap Refining Process > select bucket > status \"shipping - ship to vendor\" (enter combined metal weight as total weight shipped, select vendor by searching \"scrap\") > save; reopen, status \"assayed - vendor assay result\" (confirmed weight received = combined metal weight; assay from vendor = calculated Assay-gold) > save; store and till must be open; reopen, status \"close - complete transaction\", print scrap report to compare estimated vs actual, enter actual payout in \"amount paid\", tender type \"cashiers check\". Finalizing cannot be undone.", "said": "For \"tender type\" select \"cashiers check\"(best option to avoid throwing off till or credit card numbers)\n\nVerify all numbers are fully accurate before saving and finalizing. This step cannot be undone once completed.", "conflict": "", "correction": "", "note": "", "id": "scrap-refining-process-sop-ca6a8d1f", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-08-05", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1785945159590959"}, {"tier": "HIGH", "topic": "scrap-weight-entry-errors", "section": "SCRAP, BUCKETS & REFINING", "rule": "Decimal errors on scrap dwt entry are a recurring Bravo data problem Preston catches in the daily buy review (.02 dwt entered instead of .2 dwt).", "said": "BT-VAP014079-02 - 14k scrap gold -  Weight is wrong. Written up as .02 dwt instead of .2 dwt.", "conflict": "", "correction": "", "note": "", "id": "scrap-weight-entry-errors-123ba45c", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2024-02-10", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1707575401042389"}, {"tier": "HIGH", "topic": "shipping-scrap-dropoff-rule", "section": "SCRAP, BUCKETS & REFINING", "rule": "Preston refuses to put scrap shipments in the FedEx metal drop-off container — the receipt then says \"scanned\" rather than \"dropped off,\" which he believes could void coverage. He hands it to a counter agent before cutoff (4:30/5pm) instead.", "said": "They always try to get me to put it in the metal drop off container but I tell them no. That receipt only says it was scanned and not dropped off.", "conflict": "", "correction": "", "note": "", "id": "shipping-scrap-dropoff-rule-e2954120", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-10-02", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1759434711986159"}, {"tier": "HIGH", "topic": "shipping-scrap-insurance", "section": "SCRAP, BUCKETS & REFINING", "rule": "FedEx will only cover $1,000 on the contents of a precious-metals shipment; third-party shipping insurance runs roughly 0.5-1% of declared value. On one ~$100k lot, shipping alone was $410.58 (Saturday) or $960.83 (Friday) plus ~$500-1,000 insurance.", "said": "So FedEx will only give coverage up to $1000 on contents of precious metals. There are 3rd party companies that can do insurance 3rd party with an account.\n\nShipping alone is $410.58 by Saturday 5pm or\n$960.83 by Friday 5pm.\n\nI would have to make a business account for the insurance portion but research says it's anywhere from .5-1% of value fee for the insurance through them. So probably around $500-$1000 for insurance.", "conflict": "", "correction": "", "note": "", "id": "shipping-scrap-insurance-130fc7d5", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-03-12", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1773339743195549"}, {"tier": "HIGH", "topic": "shipping-scrap-insurance", "section": "SCRAP, BUCKETS & REFINING", "rule": "UPS Ground caps declared package value at $50,000; insurance on that amount is $850 and total shipping $1,027.75. Splitting into two $50k packages pushes the cost to ~$1,800. Refiners themselves carry the risk on their business insurance rather than buying shipping insurance.", "said": "Looks like refiners don't use any shipping insurance and they are covered through business insurance. UPS ground by Saturday says maximum declared package value is $50,000. Insurance on that amount is $850. Total shipping amount would be $1,027.75. If I split it into two packages at 50k each it's going to be pushing $1,800.00.", "conflict": "", "correction": "", "note": "", "id": "shipping-scrap-insurance-606456c3", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-03-12", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1773341086867179"}, {"tier": "HIGH", "topic": "silver-lot-valuation", "section": "SCRAP, BUCKETS & REFINING", "rule": "84.5 pounds of .925 silver (including boxes/packing) was estimated at $70-75k gross at an 85% payout rate, after allowing for knives with weighted silver handles, packing material and stones.", "said": "Roughly $70-75k I would based on the them paying 85% and factoring in some room for knives with silver handles and weight of packing material, stones etc.", "conflict": "", "correction": "", "note": "", "id": "silver-lot-valuation-6081e7bd", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-04-15", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1776263249009429"}, {"tier": "MEDIUM", "topic": "scrap-lot-value-benchmarks", "section": "SCRAP, BUCKETS & REFINING", "rule": "Preston's rough dwt-to-dollar melt conversions on monthly shipments (useful as sanity checks): 532.32 dwt ≈ $70k melt (Jan 2026); 666.29 dwt ≈ $65k (Nov 2025); 591.24 dwt ≈ $50k (Aug 2025); 792.06 dwt ≈ $65k (Jun 2025); 474.24 dwt ≈ $38k (Jul 2025); 376 dwt ≈ $30k (Mar 2025).", "said": "Gold no stone - 203.9 dwt\nGold w/ stone - 231.81 dwt\n\nTotal - 532.32\nAbout 70k melt", "conflict": "", "correction": "", "note": "", "id": "scrap-lot-value-benchmarks-6250740c", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-01-29", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1769703475655369"}, {"tier": "MEDIUM", "topic": "scrap-revenue-by-store", "section": "SCRAP, BUCKETS & REFINING", "rule": "Monthly scrap revenue by store (including silver), as Preston reports it for bonus goals — example month: Culpeper $8,527.58, Roanoke $5,202.85, Lexington $3,813.79, Waynesboro $3,459.07, Harrisonburg $3,113.12.", "said": "Rev from scrap by store\n\nPeper - 8,527.58\nHburg - 3,113.12\nLex - 3,813.79\nRoanoke - 5,202.85\nBoro - 3,459.07\n\nThis includes silver. Is this what you need for bonus goals?", "conflict": "", "correction": "", "note": "", "id": "scrap-revenue-by-store-9e416f4c", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-08-04", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1754316279999139"}, {"tier": "MEDIUM", "topic": "shipping-scrap-separation", "section": "SCRAP, BUCKETS & REFINING", "rule": "Gold is shipped sealed to the refiner while silver and platinum are held back and kept with Preston rather than shipped in the same package.", "said": "That's what I did. I kept all the silver and platinum with me. Shipped on the gold sealed.", "conflict": "", "correction": "", "note": "", "id": "shipping-scrap-separation-a19b01aa", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2024-10-03", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1727995957653869"}, {"tier": "MEDIUM", "topic": "silver-weighing-accuracy", "section": "SCRAP, BUCKETS & REFINING", "rule": "Preston's in-house silver weights have come in materially under the refiner's — 6 oz off on one shipment, ~11 oz off on another — which he attributes to needing a better scale (and pounds-to-ounces conversion) rather than to the refiner.", "said": "Either they are screwing us or I need to get a better scale for this silver. Saying it was like 11 ounce difference, I don't see how.", "conflict": "", "correction": "", "note": "", "id": "silver-weighing-accuracy-bc6417a8", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-10", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1781102102345269"}, {"tier": "MEDIUM", "topic": "silver-weighing-accuracy", "section": "SCRAP, BUCKETS & REFINING", "rule": "Follow-up commitment after a 6 oz variance.", "said": "Silver was about 6oz off of what I estimated. I'll make sure to use a better scale going forward.", "conflict": "", "correction": "", "note": "", "id": "silver-weighing-accuracy-8240a2a4", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-05-27", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1779907615742359"}, {"tier": "HIGH", "topic": "bullion-coins-discount-exclusions", "section": "COINS, BULLION & NUMISMATICS", "rule": "Storewide sale discounts never apply to coins, bullion, or clearance jewelry; all such deals must collect sales tax with no out-the-door pricing.", "said": "All deals have to collect sales tax. No out the door pricing.\n\nThe discount DOES NOT APPLY to clearance jewelry, coins, or bullion.", "conflict": "", "correction": "", "note": "", "id": "bullion-coins-discount-exclu-f9642fb8", "where": "#general (C03BETSS669)", "date": "2025-11-24", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1763994332445149"}, {"tier": "HIGH", "topic": "bullion-loan-amounts", "section": "COINS, BULLION & NUMISMATICS", "rule": "Loans on bullion must be materially below melt — a $100 loan on a 5 oz silver bar with $113 melt is too much because the redemption amount equals melt and the deal makes no sense.", "said": "5 oz silver bar - $100 - This is too much on a loan. Melt value is $113. Redemption amount is $113. Need to loan less for this to make sense.\n\n1 ounce silver bullion - $20 - Photo has 7 bars pictured. Pictures should reflect the actual items. Also paid too much on this for a loan. Loans need to be less on bullion.", "conflict": "", "correction": "", "note": "", "id": "bullion-loan-amounts-337082b3", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2024-02-12", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1707748203886979"}, {"tier": "HIGH", "topic": "buyer-network-coin-shop", "section": "COINS, BULLION & NUMISMATICS", "rule": "There is a \"coin shop\" Valley Pawn uses to quick-flip coins and bullion for immediate cash. Preston never names it in Slack. Joshua references flipping to it when cash is tight.", "said": "Can quick flip this to coin shop if needed.", "conflict": "", "correction": "", "note": "", "id": "buyer-network-coin-shop-bf15f8d3", "where": "#pepper-funds (C03BLHFJ3KN)", "date": "2025-11-06", "url": "https://valleypawnworkspace.slack.com/archives/C03BLHFJ3KN/p1762448777490069"}, {"tier": "HIGH", "topic": "coins-bravo-skus", "section": "COINS, BULLION & NUMISMATICS", "rule": "Silver coins are taken in and priced under fixed bucket SKUs so prices don't have to be manually re-set as spot moves: 8003 dimes, 8005 quarters, 8006 peace dollars, 8007 Morgan dollars, 8008 half dollars.", "said": "I have adjusted prices for the bucket skus for the silver coins. (Dimes, half dollar, quarters, Morgan and silver peace dollars) please make sure we are using these skus on the coins so we don't have to constantly reprice the silver as prices are rapidly changing. The skus are:\n\n8003 - dimes\n8005 - quarters\n8006 - peace dollars\n8007 - Morgan dollars\n8008 - half dollars", "conflict": "", "correction": "", "note": "", "id": "coins-bravo-skus-439f9e6d", "where": "#general (C03BETSS669)", "date": "2025-10-13", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1760370534980789"}, {"tier": "HIGH", "topic": "coins-bullion-category-and-tax", "section": "COINS, BULLION & NUMISMATICS", "rule": "Coins and bullion are written up in Bravo under General Merchandise (not jewelry) and entered by piece, because that makes them sales-tax exempt; writing them up as jewelry makes them all taxed. They do not go through the precious-metals weight-entry process that jewelry does.", "said": "I don't think so. The system is setup to better take in that inventory by piece and they are tax exempt that way. If we do it by jewelry it is all taxed.", "conflict": "", "correction": "", "note": "", "id": "coins-bullion-category-and-t-9ccc0234", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-09", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1781018514555629"}, {"tier": "HIGH", "topic": "coins-bullion-category-and-tax", "section": "COINS, BULLION & NUMISMATICS", "rule": "Weights are entered on every precious-metals transaction — but coins and bullion are the exception and do not go through that.", "said": "Well, no. Coins and bullion stuff doesn't go through that.", "conflict": "", "correction": "", "note": "", "id": "coins-bullion-category-and-t-a41493f1", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-09", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1781018323637959"}, {"tier": "HIGH", "topic": "coins-junk-silver-buy-price", "section": "COINS, BULLION & NUMISMATICS", "rule": "Valley Pawn normally buys 90% silver half dollars at $5 or less each; paying above melt on one is a flagged error.", "said": "Liberty half dollar - $10 - paid more than melt, usually get these for $5 or less. Why did we pay more?", "conflict": "", "correction": "", "note": "", "id": "coins-junk-silver-buy-price-3ab97d78", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2023-10-12", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1697117400541019"}, {"tier": "HIGH", "topic": "coins-writeup-standards", "section": "COINS, BULLION & NUMISMATICS", "rule": "Silver dollars must be written up as their specific coin type (Morgan Silver Dollar / Silver Peace Dollar), not lumped as \"silver bullion\" with a quantity. Generic \"silver bullion\" write-ups fail the police-report requirement and give the customer no detail.", "said": "Silver bullion - $278 - What are these? This is written up very poorly. Has quantity set to 1. No description of actual coins. These are not bullion. We can't write items up this way. Doesn't fulfill the police report needs and does not have details for the customer.", "conflict": "", "correction": "", "note": "", "id": "coins-writeup-standards-8b15992d", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2024-02-24", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1708785000661009"}, {"tier": "HIGH", "topic": "coins-writeup-standards", "section": "COINS, BULLION & NUMISMATICS", "rule": "Same rule stated earlier — bullion-tagged silver dollars should be entered under the Morgan and Peace dollar SKUs in Bravo.", "said": "Silver bullion qty 2 - $30 - These should be taken in under Morgan Silver Dollar and Silver Peace Dollar in Bravo.", "conflict": "", "correction": "", "note": "", "id": "coins-writeup-standards-04d5de10", "where": "#loans-and-buys (C03GBDKSLRE)", "date": "2023-10-24", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1698154200224509"}, {"tier": "HIGH", "topic": "numismatics-eagles-vs-generic-bullion", "section": "COINS, BULLION & NUMISMATICS", "rule": "Eagles carry a premium over generic bullion; when liquidating, find out the price difference the buyer pays, keep the eagles and sell the generic bullion.", "said": "Do we have eagles or just bullion? Find out the difference they are paying. Would rather keep the eagles and sell the bullion.", "conflict": "", "correction": "", "note": "", "id": "numismatics-eagles-vs-generi-23e53946", "where": "#harrisonburg-funds (C03BWRKEDUZ)", "date": "2026-07-13", "url": "https://valleypawnworkspace.slack.com/archives/C03BWRKEDUZ/p1783950583469379"}, {"tier": "HIGH", "topic": "numismatics-graded-coin-loan", "section": "COINS, BULLION & NUMISMATICS", "rule": "On a graded coin, Preston verifies the grading certificate (PCGS) up front AND re-verifies the physical coin with the Sigma tester at intake. On a 1 oz graded gold proof eagle he was comfortable loaning $1,600 against $1,930 melt and a $2,500 graded value.", "said": "I have a new customer looking to get a loan on a one ounce graded gold proof eagle for $1600. Melt value alone is 1930. Coin value for this grade is valued at $2500. I don't have any issue with the coin or the amount I just want to make sure you are okay with it. I already verified the coin with the PCGS grading certificate and will verify again when he brings it in with the sigma tester.", "conflict": "", "correction": "", "note": "", "id": "numismatics-graded-coin-loan-fe242620", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2023-09-18", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1695062718908309"}, {"tier": "MEDIUM", "topic": "buyer-network-coin-buyer-90-percent", "section": "COINS, BULLION & NUMISMATICS", "rule": "The coin-flip counterparty (UNNAMED) pays 90% of value on gold coins; a customer buy at ~80% therefore leaves only a thin flip margin, so Preston preferred to retail the coin instead.", "said": "Flip would be less. They are paying 90% this is about 80%", "conflict": "", "correction": "", "note": "", "id": "buyer-network-coin-buyer-90--413e8884", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-03-09", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1773078102323369"}, {"tier": "HIGH", "topic": "approval-backup-and-detailed-notes", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Approval requests must include DETAILED notes. When Preston is unavailable, Sandi Cole is the backup approver and is in the funds channels for over-$1k worksheet approvals.", "said": "I will be on vacation all next week. If anyone needs an approval please reach out to Sandi! Her number is (540) 718-9416. When sending approvals please include DETAILED notes in the request. She has been added to the funds channels also to be involved with the over 1k worksheet approvals.", "conflict": "", "correction": "", "note": "", "id": "approval-backup-and-detailed-b3688245", "where": "#general", "date": "2025-06-14", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1749917861277259"}, {"tier": "HIGH", "topic": "approval-form-1000-plus", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Transactions of $1,000 or more require following the approval procedure, which includes filling out a form.", "said": "And then just following the procedures for approvals on higher transactions. So like the $1,000 plus, you know, form that we fill out.", "conflict": "", "correction": "", "note": "", "id": "approval-form-1000-plus-3a0d3255", "where": "zoom-call:2026-10-08_1207_Preston-to-JacobCox_9m48s.txt", "date": "2026-10-08", "url": ""}, {"tier": "HIGH", "topic": "approval-form-required-fields", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Precious-metal approval forms must have the resale/melt fields filled in before Preston will approve; he rejects incomplete forms.", "said": "Please make sure form is fully filled out Benjie. Missing resale/melt.", "conflict": "", "correction": "", "note": "", "id": "approval-form-required-field-17c67b68", "where": "#roanoke-funds (C063K8E02TW)", "date": "2026-08-10", "url": "https://valleypawnworkspace.slack.com/archives/C063K8E02TW/p1786373892219799"}, {"tier": "HIGH", "topic": "approval-form-required-fields", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Preston will not approve a metals deal where the submitted melt/resale value is wrong — he asks for the melt value alone and checks the karat used.", "said": "The melt/resale value isn't correct", "conflict": "", "correction": "", "note": "", "id": "approval-form-required-field-6dd3502b", "where": "#lex-funds (C03B3K5DL6T)", "date": "2025-10-30", "url": "https://valleypawnworkspace.slack.com/archives/C03B3K5DL6T/p1761859482227059"}, {"tier": "HIGH", "topic": "approval-package-contents", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "For a funds/deal approval Preston wants photos of the items and the customer loyalty report.", "said": "Can you send me pictures of the items and customer loyalty report?", "conflict": "", "correction": "", "note": "", "id": "approval-package-contents-c57eddc9", "where": "#roanoke-funds", "date": "2025-07-19", "url": "https://valleypawnworkspace.slack.com/archives/C063K8E02TW/p1752941656107189"}, {"tier": "HIGH", "topic": "below-50-percent-approval-heuristic", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Preston will approve a gold deal he could not negotiate down as long as it is still below 50% (of melt).", "said": "I'm okay with this if we can fund. Tried to negotiate lower but he doesn't want to. Still below 50%", "conflict": "", "correction": "", "note": "", "id": "below-50-percent-approval-he-69474b54", "where": "#harrisonburg-funds (C03BWRKEDUZ)", "date": "2026-02-23", "url": "https://valleypawnworkspace.slack.com/archives/C03BWRKEDUZ/p1771877624730849"}, {"tier": "HIGH", "topic": "buy-vs-pawn-presentation", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "When presenting a deal, quote the BUY amount higher than the PAWN amount so the customer is forced to decide. Low-dollar loans have high default rates and tie up cash for a minimum of 45 days.", "said": "When taking in items are we looking at customer loyalty reports? When discussing loan vs buy are we differentiating BUY amount vs PAWN amount? Buy should be presented as more money than loan to force a decision from the customer. Low dollar loans have high default rates and tie up our money for a minimum of 45 days. This is super important when it comes to cash flow!", "conflict": "", "correction": "", "note": "", "id": "buy-vs-pawn-presentation-7990b820", "where": "#loans-and-buys", "date": "2023-11-10", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1699626600129519"}, {"tier": "HIGH", "topic": "customer-and-id-photo-mandatory", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "A photo of the customer and a photo of their ID are mandatory on every intake — not optional.", "said": "Customer - Fallon Smyl - No photo of customer or ID photo. This is not optional. Why did we not take the photo?", "conflict": "", "correction": "", "note": "", "id": "customer-and-id-photo-mandat-8dd2fc11", "where": "#loans-and-buys", "date": "2024-04-18", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1713447001008929"}, {"tier": "HIGH", "topic": "customer-priority-order", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "When multiple customers are waiting, the service order is sales customers first, then payment customers, then loan/buy customers, then firearm transfers. Gun paperwork can be started and left running while you serve others.", "said": "Prioritize the customers!!\n\n1. Sales customers\n2. Payment customers\n3. Loan/buy customers\n4. Firearm transfers\n\nYou can always get the customer started on gun paperwork while we attend to other customers and then catch up with them to finish out the paperwork.", "conflict": "", "correction": "", "note": "", "id": "customer-priority-order-43c598a0", "where": "#general", "date": "2026-02-07", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1770477414488329"}, {"tier": "HIGH", "topic": "default-rate-drives-loan-vs-buy", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "A customer with a 60% default rate on a super-low-dollar item should have been a buy, not a loan.", "said": "Daisy powerline 880 bb gun - $15 - Customer has 60% default rate, super low loan. Should this have just been a buy?", "conflict": "", "correction": "", "note": "", "id": "default-rate-drives-loan-vs--c1e72acc", "where": "#loans-and-buys", "date": "2024-02-19", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1708353000516759"}, {"tier": "HIGH", "topic": "high-default-customer-should-be-buy", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Small-dollar loans to customers with high forfeit rates should be buys instead — most people don't come back for a $10 loan.", "said": "Skull candy headphones and hart socket set - $10 - should this have been a buy? Customer has 100% forfeit rate and one loan past due, most people don't come back for $10 loans.", "conflict": "", "correction": "", "note": "", "id": "high-default-customer-should-8b7935b1", "where": "#loans-and-buys", "date": "2024-01-03", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1704292202000000"}, {"tier": "HIGH", "topic": "large-loan-buy-worksheet-threshold", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "The Large Loan/Buy worksheet is required for new loans and buys of $1,000 and over. It is NOT required for reloans. The worksheet includes a section to flag whether funds are needed.", "said": "Updated large loan/buy worksheet 1k +.\nThis does not need to be used for reloans. New loans and buys only!\nAdded section to include if you need funds or not to help streamline.", "conflict": "", "correction": "", "note": "", "id": "large-loan-buy-worksheet-thr-b1336f56", "where": "#policy-announcements", "date": "2025-02-10", "url": "https://valleypawnworkspace.slack.com/archives/C03BHQ9RLR0/p1739222257681319"}, {"tier": "HIGH", "topic": "loan-and-layaway-expire-triggers", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Preston's two hard expiration triggers: a loan with no first payment needs expired; a layaway with no payment in 60+ days needs expired. Loans are also measured on count, dollars, and percent of loan balance past 75 days (cap 5%); layaways are measured on overdue count, items needing location in Bravo (should be 0), and count with no payment in over 30 days.", "said": "Loans\n-No first payment - needs expired\n-Total dollars past 75 days cannot be greater than 5% of loan balance \n\nThings I mention - number of item past 75 days, amount of dollars past 75 days, what percent of the loan balance is past 75 days\n\n\n\nLayaways\n-no payment in 60+ days - needs expired\n\nThings I mention - layaways that are overdue (past the expected final payment date), amount layaways that need located in bravo (should be 0), and how many layaways haven't had a payment in over 30 days", "conflict": "", "correction": "", "note": "", "id": "loan-and-layaway-expire-trig-62527e0a", "where": "DM Joshua<->Preston", "date": "2026-04-13", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1776113941217899"}, {"tier": "HIGH", "topic": "muzzleloaders-super-low-loan", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Muzzleloaders should be a super low loan because of high default rates and heavy seasonality.", "said": "CVA optima v2 - $200 - where did we get value from? Muzzle loaders should be a super low loan for us as they have high default rates and are very seasonal.", "conflict": "", "correction": "", "note": "", "id": "muzzleloaders-super-low-loan-a7b8807b", "where": "#loans-and-buys", "date": "2024-03-02", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1709389800110789"}, {"tier": "HIGH", "topic": "no-high-loans-to-new-gun-customers", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Don't loan high on firearms to new customers with no redemption history. A Glock 43x should be a ~$250 loan, not $300.", "said": "Glock 43x - $300 - a bit high on this, should be loaning like $250 on these. Shouldn't be loaning super high on new customers with no redemption history with us.", "conflict": "", "correction": "", "note": "", "id": "no-high-loans-to-new-gun-cus-32ce756f", "where": "#loans-and-buys", "date": "2024-01-19", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1705674600498679"}, {"tier": "HIGH", "topic": "qualify-before-you-look-anything-up", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Before starting any loan or buy transaction, ask three qualifying questions first — prior business history, loan vs. sell, and how much they need — before looking up any values.", "said": "Before we dive in on a loan or buy transaction. You should be asking:\n\n1. Have you done business here before?\n2. Are you trying to loan or sell?\n3. How much are you needing for these items?\n\nQualify this before you look up anything. This pawnbroker 101 stuff.", "conflict": "", "correction": "", "note": "", "id": "qualify-before-you-look-anyt-609c87a0", "where": "#general", "date": "2026-02-02", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1770065757628709"}, {"tier": "HIGH", "topic": "qualify-needs-not-wants", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Qualify the customer's needs, not their wants — they may want more than they need; loaning to need protects the investment and keeps the loan affordable. Always research; never assume an item has no value without checking.", "said": "• Always do your research. Looking up items can give surprising results. Don't assume an item has no value until you double check.\n• Qualify the customer's needs and not their wants.\n    ◦ They may want more than they need. This can help protect our investment and keeps the loan affordable to the customer.", "conflict": "", "correction": "", "note": "", "id": "qualify-needs-not-wants-792845a4", "where": "#general", "date": "2023-12-18", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1702908015893249"}, {"tier": "HIGH", "topic": "what-we-pay-most-for", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "The categories to steer customers toward, in Preston's written training: guns, gold (broken or resellable), jewelry, coins, ammo, \"big toys\" (4-wheelers, dirtbikes, motorcycles, zero-turn mowers), new-gen gaming consoles, and high-end brands of all categories. Always ask if the customer has other items and tell them what we pay the most for.", "said": "• Ask if the customer has other items. Tell them what we pay the most for. This leads to getting quality merchandise and directing the flow of what we take in.\n    ◦ Guns\n    ◦ Gold\n        ▪︎ Broken or resellable!\n    ◦ Jewelry\n    ◦ Coins\n    ◦ Ammo\n    ◦ Big toys\n        ▪︎ 4 wheelers, dirtbikes, motorcycles, zero turn mowers, etc.\n    ◦ New gen gaming consoles\n    ◦ High end brands of all categories", "conflict": "", "correction": "", "note": "", "id": "what-we-pay-most-for-5be0d81b", "where": "#general", "date": "2023-12-18", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1702908015893249"}, {"tier": "HIGH", "topic": "worksheet-required-even-without-funds", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "The worksheet must be submitted regardless of whether the store needs cash sent for the deal.", "said": "Need to send worksheet either way.", "conflict": "", "correction": "", "note": "", "id": "worksheet-required-even-with-ec3dd1d7", "where": "#pepper-funds", "date": "2025-12-24", "url": "https://valleypawnworkspace.slack.com/archives/C03BLHFJ3KN/p1766599886072109"}, {"tier": "MEDIUM", "topic": "below-50-percent-approval-test", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Preston uses \"still below 50%\" (of value) as a sufficient condition to approve a large deal even when the customer refuses to negotiate down.", "said": "I'm okay with this if we can fund. Tried to negotiate lower but he doesn't want to. Still below 50%", "conflict": "", "correction": "", "note": "", "id": "below-50-percent-approval-te-95ae4e4a", "where": "#harrisonburg-funds", "date": "2026-02-23", "url": "https://valleypawnworkspace.slack.com/archives/C03BWRKEDUZ/p1771877624730849"}, {"tier": "MEDIUM", "topic": "build-history-rather-than-max-loan", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "On a repeat customer, Preston will hold a loan at the prior amount even when there's room to go higher, in order to build the customer's loyalty report.", "said": "Old amounts look good for those. Technically there is some room to go up on a few of them but I would try to do the same amount and build up his customer loyalty report.", "conflict": "", "correction": "", "note": "", "id": "build-history-rather-than-ma-21131f51", "where": "#roanoke-funds", "date": "2023-11-20", "url": "https://valleypawnworkspace.slack.com/archives/C063K8E02TW/p1700502515330089"}, {"tier": "MEDIUM", "topic": "buy-should-not-be-below-loan", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Preston's stated principle that the buy rate should not be set lower than the loan rate.", "said": "Don't want buy less than loan right?", "conflict": "Joshua overrode this on 2025-11-11 — \"loan can stay, lower buy\" and \"they can be equal.\"", "correction": "", "note": "", "id": "buy-should-not-be-below-loan-f52cc7e7", "where": "DM Joshua<->Preston", "date": "2025-11-11", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1762888275166109"}, {"tier": "MEDIUM", "topic": "customer-issue-escalation-to-preston", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "When a store has a customer problem like an unhappy buyer or a payment dispute, the manager should give Preston a heads up. He doesn't have to be involved in resolving it, but he wants to know so he can decide whether to step in.", "said": "if you ever I don't have issues like that. Just kind of loop me in. I don't necessarily have to be involved unless you need me to be but give me a heads up. It helps just so I know if I need to step in or not.", "conflict": "", "correction": "", "note": "", "id": "customer-issue-escalation-to-76b5e768", "where": "zoom-call:a9bdc82fcc804d3ea7d0abe3007abe87", "date": "2026-10-20", "url": ""}, {"tier": "MEDIUM", "topic": "customer-messaging-unable-to-take-items", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "When the store can't take in new items, tell customers it is unable to process new items at the moment. Don't explain why.", "said": "I wouldn't go into detail why I'm just saying stuff, tell them where stuff's down or unable to process new stuff at the moment.", "conflict": "", "correction": "", "note": "", "id": "customer-messaging-unable-to-fa7c3430", "where": "zoom-call:0be5295f1e7646aba4f0763590cc732f", "date": "2026-10-19", "url": ""}, {"tier": "MEDIUM", "topic": "designer-handbag-loan-judgment", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Example of Preston's designer handbag LTV: $600-700 loan against ~$1,300 used resale with box, papers and original receipt (~46-54%), against a customer asking $1,000.", "said": "Have the lady with the LV handbag looking to come in and do a loan. I have her an estimate of $600-700 on it. She's wanting the $700 ideally (was looking for $1000 originally). Bag sells used with what she has for around $1300. Has box, papers, original receipt. We will have to do another look over of everything when it comes in but want to make sure we have cash to do the loan.", "conflict": "", "correction": "", "note": "", "id": "designer-handbag-loan-judgme-68db9093", "where": "#harrisonburg-funds", "date": "2025-01-11", "url": "https://valleypawnworkspace.slack.com/archives/C03BWRKEDUZ/p1736609718283309"}, {"tier": "MEDIUM", "topic": "estimator-loan-vs-buy-rates", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "As of Nov 2025 the Bravo gold estimator was set at 50% for loan and 55% for buy; Preston's instinct was that buy should not be set below loan.", "said": "Right now loan is set to 50% and buy 55%", "conflict": "", "correction": "", "note": "", "id": "estimator-loan-vs-buy-rates-255653b7", "where": "DM Joshua<->Preston", "date": "2025-11-11", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1762886525533149"}, {"tier": "MEDIUM", "topic": "firearm-denied-customer-return-of-gun", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "If a customer is denied on a firearm transfer, do not hand a gun back to him on your own. Explain the situation to him, and make calls to confirm it is legal before returning any firearm.", "said": "Yeah, and just make sure he understands what's going on and why. And if he wants to try to get his gun back, we've got to make some phone calls to make sure we're legally allowed to do so.", "conflict": "", "correction": "", "note": "", "id": "firearm-denied-customer-retu-b5db8000", "where": "zoom-call:2026-10-13_1126_uriah-tiglao_0435.txt", "date": "2026-10-13", "url": ""}, {"tier": "MEDIUM", "topic": "firearm-loan-vs-retail-ratio", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "A firearm loan should sit well below our own retail price — on a pistol we retail at $299.99, the loan should be around $200 (~67%), not $275.", "said": "Smith & Wesson m&p 40 - $275 - Our retail selling price for us on this is $299.99. Should be around $200 on a loan for this.", "conflict": "", "correction": "", "note": "", "id": "firearm-loan-vs-retail-ratio-e40b5652", "where": "#loans-and-buys", "date": "2024-03-09", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1709994600974139"}, {"tier": "MEDIUM", "topic": "firearm-reloan-requires-transfer", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "A firearm that is paid off (even with a balance as small as one cent) must be transferred to the customer through the paperwork before it can be re-loaned on. There is no workaround to re-loan it without the transfer.", "said": "Yeah, you can't. I mean, we have to transfer it to him before we can loan on it.", "conflict": "", "correction": "", "note": "", "id": "firearm-reloan-requires-tran-640431de", "where": "zoom-call:79a4d017e2a24fd9805aeb3ad1cd8ffc", "date": "2026-10-19", "url": ""}, {"tier": "MEDIUM", "topic": "loan-buy-risk-factors", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "When deciding on loans and buys, assess risk by the item's condition, whether it will resell quickly, and how fast it sells through on eBay.", "said": "Making decisions on loans and buys on your own, identifying risk with, you know, condition, if it's going to resell quickly or not, you know, how quick it's selling through on eBay.", "conflict": "", "correction": "", "note": "", "id": "loan-buy-risk-factors-bb39aa86", "where": "zoom-call:2026-10-08_1207_Preston-to-JacobCox_9m48s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "loan-increase-interest-coverage", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "When a loan is bumped up after the original loan date, interest must be covered for the whole gap. There can be no days with no interest.", "said": "I'm just making sure you can't go through days with no interest.", "conflict": "", "correction": "", "note": "", "id": "loan-increase-interest-cover-d5b12224", "where": "zoom-call:00229642e5be482e8734c08511338585", "date": "2026-10-19", "url": ""}, {"tier": "MEDIUM", "topic": "tv-loan-ratio", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Don't loan retail on a TV — a 40\" TCL we'd sell for $110 should be a ~$60 loan (roughly 55%).", "said": "TCL 40 inch tv - $110 - This is how much we would sell this for. Should be loaning like $60 on this.", "conflict": "", "correction": "", "note": "", "id": "tv-loan-ratio-1d5d33a2", "where": "#loans-and-buys", "date": "2024-01-19", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1705674600498679"}, {"tier": "MEDIUM", "topic": "vehicle-loan-judgment", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Example of Preston's vehicle-loan judgment: customer wanted $3,500 on a 2008 RAV4 with KBB fair trade-in of $2,790; Preston proposed ~$1,500 (~54% of low-end trade value) because the customer had no substantial loan history. Joshua countered at $1,000.", "said": "Have someone trying to get a loan on their 2008 Toyota rav4 with just under 150k miles. KBB trade in value in fair condition is $2790 on the very low end. Has good inspection, condition is good overall. No lights on dash. He wanted $3,500 but I'm thinking of just offering around $1,500. Has had some loans with us before but nothing substantial at all.", "conflict": "",
