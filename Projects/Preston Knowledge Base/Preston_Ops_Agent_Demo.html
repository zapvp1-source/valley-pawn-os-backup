tice-requi-e3db6993", "where": "zoom-call:aebe1af2b4a541ddbf5669fe7f782d67", "date": "2026-10-12", "url": ""}, {"tier": "MEDIUM", "topic": "card-reader-errors-open-ticket", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Don't just push transactions through a faulty card reader. Treat it as a problem to fix by opening a support ticket, and capture the error details for it.", "said": "But it sounds like we're just trying to push stuff through. That's not like fixing it rather. So we got a probably open a ticket or something.", "conflict": "", "correction": "", "note": "", "id": "card-reader-errors-open-tick-971e7820", "where": "zoom-call:0bbb0b7d746c4bee8ca7d05b93d81eea", "date": "2026-10-13", "url": ""}, {"tier": "MEDIUM", "topic": "card-reader-failure-use-backup-reader", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a card reader is throwing errors, switch to the store's other card reader rather than continuing on the failing one.", "said": "Okay, so you can select the other one and use that.", "conflict": "", "correction": "", "note": "", "id": "card-reader-failure-use-back-06447c69", "where": "zoom-call:0bbb0b7d746c4bee8ca7d05b93d81eea", "date": "2026-10-13", "url": ""}, {"tier": "MEDIUM", "topic": "cash-sales-during-system-problems", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When the system is having problems, cash sales can still be made by recording the tag information and cash sale price, then ringing the sale out later.", "said": "We can do cash sales by recording tag information and cash sale price to ring out later.", "conflict": "", "correction": "", "note": "", "id": "cash-sales-during-system-pro-4ade7339", "where": "#general (Preston Peters, Operations Manager)", "date": "2026-10-09", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1791573897704449"}, {"tier": "MEDIUM", "topic": "clearance-markdown-percentage", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The standing clearance markdown is set at 40%, and Preston believes it could go deeper now that clearance markdowns are running.", "said": "Has been set to 40% it could probably be less now though since we are doing clearance markdowns.", "conflict": "", "correction": "", "note": "", "id": "clearance-markdown-percentag-59d4b2c6", "where": "DM Joshua<->Preston", "date": "2026-08-24", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1787574469297889"}, {"tier": "MEDIUM", "topic": "credit-card-reconciliation", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Credit card transactions run through Bravo and sync automatically, so daily reconciliation is normally a non-issue. Only weird transactions need a manual look, usually reviewed together with the manager.", "said": "now if you have a weird transaction you should be looking at that stuff which we usually do kind of go over it together I feel like but beyond your daily daily stuff it's it's all transacted through Bravo should all automatically sync up", "conflict": "", "correction": "", "note": "", "id": "credit-card-reconciliation-15183478", "where": "zoom-call:38fd73720bb342aeb12f016ed0618017", "date": "2026-10-12", "url": ""}, {"tier": "MEDIUM", "topic": "cross-training-staff-help-all-customers", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Any employee should be able to help any customer, so business doesn't depend on one person (Sandy) being in the store. Preston wants training focused on getting staff comfortable offering stronger values.", "said": "Sandy's great and all but we want everybody to be able to help everybody.", "conflict": "", "correction": "", "note": "", "id": "cross-training-staff-help-al-d14a9c4c", "where": "zoom-call:2026-10-08_1225_Preston-to-JoshuaBurnett_8m57s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "disclosed-defect-sold-as-tested", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "If a known defect is disclosed to the buyer and the item is tested in store at the time of sale, the store treats the sale as final and does not owe a refund or swap later.", "said": "We still had the product. We sold the product, disclosing all issues with it. You're okay with it.", "conflict": "", "correction": "", "note": "", "id": "disclosed-defect-sold-as-tes-beea03ff", "where": "zoom-call:2026-08-29_HAR_store-to-Preston_14m42s.txt", "date": "2026-08-29", "url": ""}, {"tier": "MEDIUM", "topic": "escalate-urgent-issues-to-preston", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Store staff should always loop Preston in when an urgent or emergency issue comes up, such as a payment system problem, so he can step in early.", "said": "Yeah, I mean, at least always loop me in.", "conflict": "", "correction": "", "note": "", "id": "escalate-urgent-issues-to-pr-ded598a5", "where": "zoom-call:0bbb0b7d746c4bee8ca7d05b93d81eea", "date": "2026-10-13", "url": ""}, {"tier": "MEDIUM", "topic": "firearm-classification-errors", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "A firearm entered under the wrong type (AR-15 logged as a pistol) or wrong manufacturer must be corrected in both the system and the gun log. A barrel length entered as 12 inches on a rifle would make it illegal and must be verified.", "said": "Winchester Ranger 30-30 - $250 - No photo of item; Barrel length is listed as 12 inches which would make this illegal. Is this accurate?", "conflict": "", "correction": "", "note": "", "id": "firearm-classification-error-2b945000", "where": "#loans-and-buys", "date": "2024-03-30", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1711805400000000"}, {"tier": "MEDIUM", "topic": "firearm-no-serial-send-receiver-photos", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "If a firearm has no visible serial number, send Preston pictures of the receiver so he can verify. The loan can be written up and corrected afterward if needed.", "said": "you send me some pictures of the receiver just so I can verify", "conflict": "", "correction": "", "note": "", "id": "firearm-no-serial-send-recei-d0da70af", "where": "zoom-call:2026-10-08_1202_staff-x3983-to-Preston_3m54s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "firearm-serial-number-pre-1968", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Firearms made before 1968 were not required to carry serial numbers, so an older gun with no serial number can be legitimate. Check the age first when you can't find one.", "said": "They weren't required before 1968.", "conflict": "", "correction": "", "note": "", "id": "firearm-serial-number-pre-19-5268efd2", "where": "zoom-call:2026-10-08_1202_staff-x3983-to-Preston_3m54s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "fpd-is-dead-money", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Items sitting in first payment default are \"dead money\" that should be expired and put on the sales floor as inventory.", "said": "34 items in first payment default. Should be looking to expire these. Dead money that could be inventory here. Need these expired ASAP and put on the sales floor.", "conflict": "", "correction": "", "note": "", "id": "fpd-is-dead-money-45804a79", "where": "#loans-and-buys", "date": "2024-02-10", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1707577201000000"}, {"tier": "MEDIUM", "topic": "high-value-deal-judgment-knives", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Example of Preston's large-loan judgment: $2,000 loan against a conservative $5,000 value (~40% LTV), justified by a long customer history worth $45,460.50 in pawn service charges since 2017.", "said": "Have Tim Shelton trying to get a loan for $2000 on two really high end knives at Harrisonburg. Conservative value on the two knives is $5000. They are worth closer to $6000 though realistically.", "conflict": "", "correction": "", "note": "", "id": "high-value-deal-judgment-kni-939cd4e1", "where": "DM Joshua<->Preston", "date": "2023-12-08", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1702049443893019"}, {"tier": "MEDIUM", "topic": "insurance-claim-metals-valuation", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "For an insurance claim on lost gold, Preston's method is to snapshot the gold spot price as of the date the claim/report was filed, then run the standard dwt melt formula. On a 54.8 dwt 14k chain the loan was $380 and melt at claim time was $7,261.", "said": "That missing chain from Hburg. The guy just paid it off. It's the one that's been missing on loan for a few years. Need to discuss what we are going to/want to do. The loan was for $380. Chain is 54.8dwt of 14k. Melt is $7,261 currently.", "conflict": "", "correction": "", "note": "", "id": "insurance-claim-metals-valua-b2f165eb", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-05-21", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1779398229260599"}, {"tier": "MEDIUM", "topic": "insurance-claim-metals-valuation", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The snapshot rule stated directly.", "said": "I'd try and snapshot gold price at time of filing the report?", "conflict": "", "correction": "", "note": "", "id": "insurance-claim-metals-valua-5e120b35", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-07-29", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1785357517690059"}, {"tier": "MEDIUM", "topic": "inventory-prep-factory-reset", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When preparing inventory for the sales floor, clean it up and reset electronics back to factory settings if they need it.", "said": "That's going to be resetting it back to factory if it needs it.", "conflict": "", "correction": "", "note": "", "id": "inventory-prep-factory-reset-c5e30b6f", "where": "zoom-call:2026-10-08_1207_Preston-to-JacobCox_9m48s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "known-slow-movers", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "A leaf vac/chipper/mulcher sat over 2 years in Lexington and is treated as a known very-difficult item to move.", "said": "Troy bilt leaf vac/chipper/mulcher -$120 - Had one of these in Lexington sit for over 2 years. Really, really difficult to sell. Let's move this out asap.", "conflict": "", "correction": "", "note": "", "id": "known-slow-movers-236e36e9", "where": "#loans-and-buys", "date": "2023-10-13", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1697203801998889"}, {"tier": "MEDIUM", "topic": "medical-devices-no-ebay", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Medical devices can't be sold on eBay, which makes them a no for intake.", "said": "Can't sell it on eBay since it's a medical device", "conflict": "", "correction": "", "note": "", "id": "medical-devices-no-ebay-562985de", "where": "#deal-questions", "date": "2025-12-15", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1765827187440699"}, {"tier": "MEDIUM", "topic": "neat-clean-checklist-standard", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The neat/clean/orderly checklist (part of the qualifiers) means keeping the area behind the counter clean and putting pawns away. No extra work is expected beyond the normal standard.", "said": "Behind the counter should be clean pawns should be put up.", "conflict": "", "correction": "", "note": "", "id": "neat-clean-checklist-standar-5408e7f4", "where": "zoom-call:38fd73720bb342aeb12f016ed0618017", "date": "2026-10-12", "url": ""}, {"tier": "MEDIUM", "topic": "new-hire-offer-authority-90-days", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "New employees shouldn't make offers on items until they are trained. Offer-making should be introduced gradually, around the 90-day mark.", "said": "He's not trained for it. We gotta ease him into that, which is again, 90 days is where this should be getting into that stuff and we're not there by any means.", "conflict": "", "correction": "", "note": "", "id": "new-hire-offer-authority-90--7257aa38", "where": "zoom-call:de979520433c4c1da7628d74f4251685", "date": "2026-10-15", "url": ""}, {"tier": "MEDIUM", "topic": "new-hire-sales-goals-30-60-90", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "New retail hires ramp through monthly sales goals of $7,000 for the first 30 days, $9,000 for the next 30, and $12,000 for days 60-90.", "said": "But you go for for like the 30 days is going to be 7000 next 30 days 9000 and then 12,000 that kind of just ramps you into, you know, expected typical", "conflict": "", "correction": "", "note": "", "id": "new-hire-sales-goals-30-60-9-2b8ffec8", "where": "zoom-call:2026-10-08_1207_Preston-to-JacobCox_9m48s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "no-guaranteed-offers-over-phone", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Don't guarantee a price over the phone. The offer depends on the item in hand, and if what the customer describes or looked up doesn't match what they bring in, the phone estimate doesn't hold.", "said": "If what he looked up does not match what he physically has brought in the store, you know, that's why we can't guarantee any offer over the phone", "conflict": "", "correction": "", "note": "", "id": "no-guaranteed-offers-over-ph-7a28f468", "where": "zoom-call:de979520433c4c1da7628d74f4251685", "date": "2026-10-15", "url": ""}, {"tier": "MEDIUM", "topic": "pawn-reload-amount-change", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "A customer may sometimes want a reload for less or more than usual. Make sure a higher or lower amount makes sense before agreeing.", "said": "For the customer, there's occasions where they might want less or more and we got to make sure that makes sense to go up or whatever.", "conflict": "", "correction": "", "note": "", "id": "pawn-reload-amount-change-979a5256", "where": "zoom-call:2026-10-08_1207_Preston-to-JacobCox_9m48s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "pawn-reload-procedure", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "To process a reload, verify the item is what it is, retest it, then do the reload. The reload amount is generally the same as before.", "said": "It's just verify the item is what it is retest it. Do the reload generally it's always the same amount.", "conflict": "", "correction": "", "note": "", "id": "pawn-reload-procedure-2c8afd55", "where": "zoom-call:2026-10-08_1207_Preston-to-JacobCox_9m48s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "payment-reversal-dont-dispute", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a customer payment has to be reversed, reverse it rather than disputing it. Disputes get lost and add fees on top, reportedly hundreds of dollars.", "said": "It's like hundreds of dollars on top just to lose a dispute.", "conflict": "", "correction": "", "note": "", "id": "payment-reversal-dont-disput-b63550d0", "where": "zoom-call:2026-09-22_CUL_Preston-to-store_1m57s.txt", "date": "2026-09-22", "url": ""}, {"tier": "MEDIUM", "topic": "photo-required-every-item", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Every intake item requires a photo of the actual item, and photos must reflect the actual items and quantities taken in.", "said": "Aventon Pace 500 - No photo of item - Why are we not getting photos? 2 yesterday and one today.", "conflict": "", "correction": "", "note": "", "id": "photo-required-every-item-cb8ff861", "where": "#loans-and-buys", "date": "2024-03-15", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1710509400000000"}, {"tier": "MEDIUM", "topic": "pull-list-priority", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Work the pull list with higher-dollar items first, then jewelry.", "said": "As far as the pull list goes We should try to prioritize the higher dollar stuff first and get that knocked out and then the jewelry", "conflict": "", "correction": "", "note": "", "id": "pull-list-priority-3c7b1794", "where": "zoom-call:0be5295f1e7646aba4f0763590cc732f", "date": "2026-10-19", "url": ""}, {"tier": "MEDIUM", "topic": "ram-untested-ebay-comps", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "For RAM that isn't new or sealed and can't be tested in-store, check eBay prices for \"UNTESTED RAM\" first. This shows whether there is any worthwhile margin before making an offer.", "said": "Anything like this, if they are not new, still sealed, and I have no way of testing them, I first check to see with the market is like on Ebay for UNTESTED RAM to see if we can even make anything worth while.", "conflict": "", "correction": "", "note": "", "id": "ram-untested-ebay-comps-4becf83a", "where": "#deal-questions (Uriah Tiglao, Lexington manager)", "date": "2026-10-15", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1792101005062159"}, {"tier": "MEDIUM", "topic": "red-flag-bulk-new-in-box", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Multiple identical new-in-box items from a new customer, or a batch of new-in-box items from someone out of state, is a pattern Preston flags and asks for the story behind.", "said": "3 total NIB Bissel products, 2 being the exact same. -  What was the story on this? New customer seems a bit odd.", "conflict": "", "correction": "", "note": "", "id": "red-flag-bulk-new-in-box-8daad58d", "where": "#loans-and-buys", "date": "2024-03-07", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1709821800000000"}, {"tier": "MEDIUM", "topic": "report-sales-by-associate", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "To see each associate's sales, run the report: go to Reports, choose Sold Inventory, and group by associate. This lets you compare associates over the same time period.", "said": "I would run the report, you know, where you go to reports, sold inventory and you group by associate.", "conflict": "", "correction": "", "note": "", "id": "report-sales-by-associate-787cbf2f", "where": "zoom-call:2026-10-08_1312_Preston-to-Benjie_4m25s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "report-sales-by-associate", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "To see an associate's sales numbers, run the Sold Inventory report (under Reports) and group it by associate. Running it for the same date range lets you compare associates over the same period.", "said": "I would run the report, you know, where you go to reports, sold inventory. and you group by an associate, you know what I'm saying?", "conflict": "", "correction": "", "note": "", "id": "report-sales-by-associate-a90f9109", "where": "zoom-call:6f3dc1bdd04d46ea8e59ab90dc4d217b", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "return-policy-30-day-window", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The store return/warranty policy covers used items for 30 days from purchase. Problems reported months later fall outside it.", "said": "It's not within 30 days like our policy covers.", "conflict": "", "correction": "", "note": "", "id": "return-policy-30-day-window-6d4b747e", "where": "zoom-call:2026-08-29_HAR_store-to-Preston_14m42s.txt", "date": "2026-08-29", "url": ""}, {"tier": "MEDIUM", "topic": "return-policy-30-days-used-items", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Returns/warranty coverage on used items is limited to 30 days. Issues raised months after the sale fall outside the policy.", "said": "It's not within 30 days like our policy covers.", "conflict": "", "correction": "", "note": "", "id": "return-policy-30-days-used-i-da6df0c4", "where": "zoom-call:b7985902fd5c481cb3c1de9b038e8437", "date": "2026-08-29", "url": ""}, {"tier": "MEDIUM", "topic": "sales-by-associate-report", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "To see an associate's sales numbers, run the Reports > Sold Inventory report and group it by associate. This lets a new hire compare their numbers with others over the same period.", "said": "I would run the report, you know, where you go to reports, sold inventory and then you group by associate.", "conflict": "", "correction": "", "note": "", "id": "sales-by-associate-report-3788ba52", "where": "zoom-call:2026-10-08_1312_benjie-moore_0424.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "sales-goal-measurement-period", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Training sales goals are measured over 30-day periods from the employee's start date, not by calendar month.", "said": "we're gonna look at this off your start date 30 days rather than like the month because it doesn't line up perfectly just to let you know.", "conflict": "", "correction": "", "note": "", "id": "sales-goal-measurement-perio-44a94bf5", "where": "zoom-call:2026-10-08_1207_Preston-to-JacobCox_9m48s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "salesperson-price-ownership", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Salespeople should settle on a fair number and close the deal themselves, rather than going back to the manager on price. Handling pricing start to finish builds customer confidence.", "said": "And the best thing you can do is try to get an idea of what is a fair number to work with and try to close it with that number.", "conflict": "", "correction": "", "note": "", "id": "salesperson-price-ownership-4959c31c", "where": "zoom-call:2026-10-08_1207_Preston-to-JacobCox_9m48s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "scale-recertification", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Store scales are dropped off for recertification — Preston handles this personally as part of the metals-weighing chain of custody.", "said": "I'm heading to drop off scales to get recertification and grab Comcast equipment", "conflict": "", "correction": "", "note": "Message timestamp shown in channel read as 2025-11-11 14:17:00 EST; exact permalink ts not surfaced by search — verify before publishing this one.", "id": "scale-recertification-da9ab479", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-11-11", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1762886220000000"}, {"tier": "MEDIUM", "topic": "shipping-cost-in-valuation", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "For items that won't sell in store, factor shipping cost and realistic resale into the offer, not just the online comp.", "said": "Oscar Schmidt OS-21C autoharp - $150- Seeing a good number of these sell for $150-$200. Not an item that will likely sell in store. Did we think about shipping costs and realistic resell price?", "conflict": "", "correction": "", "note": "", "id": "shipping-cost-in-valuation-df5af0e6", "where": "#loans-and-buys", "date": "2023-10-05", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1696512600549089"}, {"tier": "MEDIUM", "topic": "silver-certificates", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Currency values Preston confirmed as good buys: $1 silver certificate paid $50 against a $100-120 value; $2 silver certificate paid $48 against a $100-150 value.", "said": "1 dollar certificate - paid $50 - Value $100-$120\n\n2 dollar silver certificate- paid $48 - value $100-150", "conflict": "", "correction": "", "note": "", "id": "silver-certificates-5d7726e5", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-18", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1781794123213649"}, {"tier": "MEDIUM", "topic": "sunglasses-performance", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Reason for the sunglasses refusal — poor performance, before authenticity risk is even considered.", "said": "They have been pretty bad for us. Not even considering authenticity.", "conflict": "", "correction": "", "note": "", "id": "sunglasses-performance-cffbb564", "where": "#deal-questions", "date": "2025-10-18", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1760808569949109"}, {"tier": "MEDIUM", "topic": "training-needs-list-process", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When an employee needs more training (e.g., handbags, antique firearms), they should write up a list of those items so training can be prioritized, and share it with Preston and Sandy.", "said": "you know make a list of of that so that way we can prioritize", "conflict": "", "correction": "", "note": "", "id": "training-needs-list-process-ea95a6dc", "where": "zoom-call:2026-10-08_1225_Preston-to-JoshuaBurnett_8m57s.txt", "date": "2026-10-08", "url": ""}, {"tier": "MEDIUM", "topic": "verify-source-clearout-company-buys", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When someone sells a large lot said to come from an estate or home clear-out company, ask which company it is and get the seller to name it. Ask casually, as if out of interest.", "said": "You still probably asked what company it is at some level", "conflict": "", "correction": "", "note": "", "id": "verify-source-clearout-compa-852ae503", "where": "zoom-call:779a2c14718a4ac89f6d5b7b0c5ad067", "date": "2026-10-13", "url": ""}, {"tier": "MEDIUM", "topic": "watch-authentication-inspect-movement", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "To check a watch's authenticity, open the case back and look at the movement. A good-looking exterior can hide a plastic or battery-driven interior on a watch that should be mechanical. Preston plans to order case-back removal tools, which are inexpensive.", "said": "Look at the movement tells you a lot. I mean, you can have the outside look pretty good and then the open inside that's like plastic and battery and you know when they're supposed to be mechanics or something.", "conflict": "", "correction": "", "note": "", "id": "watch-authentication-inspect-371d176e", "where": "zoom-call:9cdd3d517430447eb25c621de7e7a115", "date": "2026-10-17", "url": ""}, {"tier": "MEDIUM", "topic": "writeup-quality-standard", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Items must be written up with real descriptions and correct quantities — vague write-ups fail the police report requirement and leave the customer without detail.", "said": "Silver bullion - $278 - What are these? This is written up very poorly. Has quantity set to 1. No description of actual coins. These are not bullion. We can't write items up this way. Doesn't fulfill the police report needs and does not have details for the customer.", "conflict": "", "correction": "", "note": "", "id": "writeup-quality-standard-282956ef", "where": "#loans-and-buys", "date": "2024-02-24", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1708781400000000"}, {"tier": "MEDIUM", "topic": "xbox-one-original-price-drop", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The original Xbox One is no longer worth $50 on intake — some are selling for only $50-$60 retail.", "said": "Xbox one original - $50 - This is too much on these now. Some are selling for $50-$60.", "conflict": "", "correction": "", "note": "", "id": "xbox-one-original-price-drop-9f88f2f8", "where": "#loans-and-buys", "date": "2025-03-20", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1742496164761469"}, {"tier": "LOW", "topic": "30-60-90-plan-acknowledgment", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The 30/60/90 day action plan is reviewed in person with the employee. The employee then signs an acknowledgment in Gusto confirming they understand it.", "said": "So I wanted them to go over with you in person and then there's one the sign saying that you acknowledge and understand it", "conflict": "", "correction": "", "note": "", "id": "30-60-90-plan-acknowledgment-fdaeb780", "where": "zoom-call:2026-10-08_1225_Preston-to-JoshuaBurnett_8m57s.txt", "date": "2026-10-08", "url": ""}, {"tier": "LOW", "topic": "atf-police-department-transfer-account", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "For a transfer coming from a police department, receive it from the department itself, creating an account for the department in the system if possible.", "said": "I would receive it from the police department if you can make an account for the police department or receive it from them.", "conflict": "", "correction": "", "note": "", "id": "atf-police-department-transf-3d563507", "where": "zoom-call:ec8e499beb574de68d5c45ff0b59dbbe", "date": "2026-10-12", "url": ""}, {"tier": "LOW", "topic": "atf-police-department-transfer-receiving", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When receiving a firearm from a police department, the working approach is to log it under the officer's name on behalf of the department and fill out as much of the record as possible. The speaker was unsure and was going to look into it further.", "said": "I'm pretty sure you receive it under the officer's name on behalf of the police department and just fill out as much as you can.", "conflict": "", "correction": "", "note": "", "id": "atf-police-department-transf-5695452f", "where": "zoom-call:ec8e499beb574de68d5c45ff0b59dbbe", "date": "2026-10-12", "url": ""}, {"tier": "LOW", "topic": "atf-police-dept-firearm-transfer-receiving", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a police department buys a firearm and the transfer paperwork can't be entered the usual way, receive it in the system from the police department. Create an account for the department if possible. Preston was unsure of the exact procedure.", "said": "I would receive it from the police department. If you can make an account for the police department or receive it from them.", "conflict": "", "correction": "", "note": "", "id": "atf-police-dept-firearm-tran-e38d090f", "where": "zoom-call:2026-10-12_0959_chadd-mcclintic_0857.txt", "date": "2026-10-12", "url": ""}, {"tier": "LOW", "topic": "atf-police-dept-transfer-treat-as-private-transfer", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "A firearm transfer to or from a police department can be handled much like a private transfer. List the police department on it, and add notes to the ATF record.", "said": "I would treat it like through like, like a, like a private transfer essentially to a degree, but you're going to have the police department in, in, in there like, and you can make notes probably on the ATF record as well.", "conflict": "", "correction": "", "note": "", "id": "atf-police-dept-transfer-tre-b6431f56", "where": "zoom-call:2026-10-12_0959_chadd-mcclintic_0857.txt", "date": "2026-10-12", "url": ""}, {"tier": "LOW", "topic": "bank-account-adding-employees", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When adding employees to the business bank account, book an appointment online and tell the bank it will have to add them manually, because the account already has many people on it.", "said": "Make sure when you do just tell them that they they're gonna have to manually add them because there's so many people on the account", "conflict": "", "correction": "", "note": "", "id": "bank-account-adding-employee-34f86c43", "where": "zoom-call:2026-10-08_0949_Preston-to-Sandi_1m55s.txt", "date": "2026-10-08", "url": ""}, {"tier": "LOW", "topic": "bravo-issue-connectivity-not-card-reader", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The Bravo issue the store was seeing was described as a connectivity problem, not a card reader problem. Check connectivity first when Bravo acts up, and keep an eye on the card reader while using it.", "said": "the Bravo issue is a connectivity issue.", "conflict": "", "correction": "", "note": "", "id": "bravo-issue-connectivity-not-f4d86511", "where": "zoom-call:2a87d005551d47f5b7651e275779ae25", "date": "2026-10-15", "url": ""}, {"tier": "LOW", "topic": "bravo-restart-troubleshooting", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When Bravo acts up, restarting the program may clear the problem. Culpeper had a similar issue and it stopped after a restart, though the source does not say what the issue was.", "said": "We were having the a simular issue earlier. Restarted Bravo and since, no issue.", "conflict": "", "correction": "", "note": "", "id": "bravo-restart-troubleshootin-b2361800", "where": "#general (Sandra Cole, Culpeper manager)", "date": "2026-10-09", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1791572618077869"}, {"tier": "LOW", "topic": "card-machine-issue-escalation", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a credit card machine problem can't be fixed locally, such as an update that freezes on install, message the details to Preston and Josh in the chat. They forward it to the tech for help.", "said": "Key message to that information to me and Josh in the chat and we'll forward it to the tech and see if they can give us any info on that.", "conflict": "", "correction": "", "note": "", "id": "card-machine-issue-escalatio-cd07339b", "where": "zoom-call:2026-10-08_1312_benjie-moore_0424.txt", "date": "2026-10-08", "url": ""}, {"tier": "LOW", "topic": "clearout-seller-company-documentation", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "For clear-out company sellers, ask whether they have anything showing the company's name, such as paperwork or a card. This helps confirm the story behind the items.", "said": "just get who it is and then you'd also be like so Do you need anything that says for the company's name on it or?", "conflict": "", "correction": "", "note": "", "id": "clearout-seller-company-docu-9f698906", "where": "zoom-call:779a2c14718a4ac89f6d5b7b0c5ad067", "date": "2026-10-13", "url": ""}, {"tier": "LOW", "topic": "counterfeit-watch-resale-label-as-replica", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "A counterfeit watch may be sold cheaply, but it must be clearly labeled as a replica.", "said": "just clearly label it as a as a replica", "conflict": "", "correction": "", "note": "", "id": "counterfeit-watch-resale-lab-b93b1b47", "where": "zoom-call:9cdd3d517430447eb25c621de7e7a115", "date": "2026-10-17", "url": ""}, {"tier": "LOW", "topic": "custom-purity-unlisted-karat", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When an item's karat (such as 16k) isn't available in Bravo, use the custom purity option to write it up.", "said": "Should be a custom purity option", "conflict": "", "correction": "", "note": "", "id": "custom-purity-unlisted-karat-e5c8e827", "where": "#deal-questions (Preston Peters, Operations Manager)", "date": "2026-10-09", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1791577890719919"}, {"tier": "LOW", "topic": "employee-purchase-window-handbook-error", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The handbook's \"90 days\" employee purchase window is wrong. It likely came from an earlier draft policy and will be corrected. The correct number was not stated.", "said": "Yeah, that's not accurate. That might have got pulled from Josh's original policy that he wanted, so we'll have to update that.", "conflict": "", "correction": "", "note": "", "id": "employee-purchase-window-han-88e19cdf", "where": "zoom-call:38fd73720bb342aeb12f016ed0618017", "date": "2026-10-12", "url": ""}, {"tier": "LOW", "topic": "estimator-buy-price", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The estimator's number is a reasonably good guide for buy prices. If the item can be bought cheaper, take the cheaper deal. This was said about a specific set of deals.", "said": "The estimator's at a pretty reasonable number. Obviously, if we get it cheaper, get the deal done, it's great.", "conflict": "", "correction": "", "note": "", "id": "estimator-buy-price-ded8587d", "where": "zoom-call:38fd73720bb342aeb12f016ed0618017", "date": "2026-10-12", "url": ""}, {"tier": "LOW", "topic": "exit-sign-battery-backup", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "An exit sign is supposed to run on its backup battery during a power outage and light up. It was explained in the context of a fire marshal inspection item on a non-functioning exit sign.", "said": "So it gets emergency power from the battery and it lights up.", "conflict": "", "correction": "", "note": "", "id": "exit-sign-battery-backup-670a8e6a", "where": "zoom-call:2a87d005551d47f5b7651e275779ae25", "date": "2026-10-15", "url": ""}, {"tier": "LOW", "topic": "feel-out-seller-story-in-conversation", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "A seller's story can't be verified on paper. Judge it by talking with them while you work the deal.", "said": "It's one of those things you kind of got to do in conversation while you're doing", "conflict": "", "correction": "", "note": "", "id": "feel-out-seller-story-in-con-b165e8cd", "where": "zoom-call:779a2c14718a4ac89f6d5b7b0c5ad067", "date": "2026-10-13", "url": ""}, {"tier": "LOW", "topic": "firearm-sale-then-layaway-preferred", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a customer wants cash against a gun he is already buying out, the preferred route is to finalize the sale with the paperwork and then set up the layaway. That way the store earns again, rather than doing a layaway with cash back.", "said": "it's best for us if he just does the paperwork we finalize the sale and then we do the layaway because then we make money again", "conflict": "", "correction": "", "note": "", "id": "firearm-sale-then-layaway-pr-317843c7", "where": "zoom-call:79a4d017e2a24fd9805aeb3ad1cd8ffc", "date": "2026-10-19", "url": ""}, {"tier": "LOW", "topic": "firearm-serial-location-receiver", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The serial number is normally on the receiver of the firearm. The speaker is not identified in the transcript, and it conflicts with the pre-1968 no-serial note, so treat it as a general guide only.", "said": "the serial numbers always on the receiver of the firearm.", "conflict": "Preston also says guns made before 1968 weren't required to have serial numbers, so \"always on the receiver\" does not hold for older guns.", "correction": "", "note": "", "id": "firearm-serial-location-rece-d09203ff", "where": "zoom-call:2026-10-08_1202_staff-x3983-to-Preston_3m54s.txt", "date": "2026-10-08", "url": ""}, {"tier": "LOW", "topic": "firearm-trade-denied-refund", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a firearm trade is denied at transfer, the system reverses it as if we bought the customer's traded gun and sold him the difference, so the refund can come back as the full amount. Preston treated the full refund as the way to process it.", "said": "The money is, it'd be potentially a full amount.", "conflict": "", "correction": "", "note": "", "id": "firearm-trade-denied-refund-da6e4079", "where": "zoom-call:2026-10-13_1126_uriah-tiglao_0435.txt", "date": "2026-10-13", "url": ""}, {"tier": "LOW", "topic": "firearm-trade-nics-denial-refund", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "If a customer is denied on a firearm that was part of a trade, the best-case handling is a full refund of the whole deal, not just the remainder he paid. This came from one case and the speaker on the call isn't identified.", "said": "So the best case scenario is the full refund.", "conflict": "", "correction": "", "note": "", "id": "firearm-trade-nics-denial-re-40eafb8e", "where": "zoom-call:ab47ea2963e049ba9c8bfb3457265572", "date": "2026-10-13", "url": ""}, {"tier": "LOW", "topic": "goodwill-buyback-defective-console-as-is-value", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "For an out-of-policy complaint on a console with a known defect, the offer is to buy it back at its as-is/for-parts value with the defect. Make a fairly strong offer, since recovering our money on eBay after fees is acceptable.", "said": "we would look up What that PS 5 is worth with the damage? HDMI or whatever as is for parts etc. Make him an offer a fairly strong offer because if we get just You know our money back on eBay after fees It's not the end of the world", "conflict": "", "correction": "", "note": "", "id": "goodwill-buyback-defective-c-6d625826", "where": "zoom-call:b7985902fd5c481cb3c1de9b038e8437", "date": "2026-08-29", "url": ""}, {"tier": "LOW", "topic": "goodwill-buyback-ebay-breakeven", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "On a goodwill buyback of a defective console, Preston is willing to make a fairly strong offer. His reasoning is that recovering the store's cost on eBay after fees is an acceptable outcome.", "said": "Because if we get just our money back on eBay after fees, it's not the end of the world.", "conflict": "", "correction": "", "note": "", "id": "goodwill-buyback-ebay-breake-b43d1498", "where": "zoom-call:2026-08-29_HAR_store-to-Preston_14m42s.txt", "date": "2026-08-29", "url": ""}, {"tier": "LOW", "topic": "goodwill-system-to-system-swap-no-accessories", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "For this goodwill case, handle the swap system to system and leave controllers and accessories out of the deal. Give the customer a fair deal both ways, and he may owe a difference on a replacement.", "said": "Just do as good as you can both ways for him and See what we can agree on we don't need his controllers. He doesn't need our controllers Just do it system to system or whatever", "conflict": "", "correction": "", "note": "", "id": "goodwill-system-to-system-sw-c43fbfde", "where": "zoom-call:b7985902fd5c481cb3c1de9b038e8437", "date": "2026-08-29", "url": ""}, {"tier": "LOW", "topic": "gun-log-printing", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The daily gun log backs up to the computer automatically, so printing it every day is probably not needed. The handbook's daily print requirement is questionable and was not formally changed in this call.", "said": "So our gun log should be automatically back it up to the computer.", "conflict": "", "correction": "", "note": "", "id": "gun-log-printing-b19f1795", "where": "zoom-call:38fd73720bb342aeb12f016ed0618017", "date": "2026-10-12", "url": ""}, {"tier": "LOW", "topic": "gun-safety-course-reimbursement", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The company reimburses employees for the gun safety course certification once they submit the certificate. The transcript is fragmentary, so the exact terms are unclear.", "said": "we pay you right back", "conflict": "", "correction": "", "note": "", "id": "gun-safety-course-reimbursem-c83a6fc6", "where": "zoom-call:2026-10-08_1225_Preston-to-JoshuaBurnett_8m57s.txt", "date": "2026-10-08", "url": ""}, {"tier": "LOW", "topic": "id-missing-fields-passport", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "A passport doesn't carry every field the computer asks for, such as address and eye color. Get the missing details from the customer or from another ID.", "said": "The computer's going to ask, but you just have to get that from like address, eye color and all that good stuff.", "conflict": "", "correction": "", "note": "", "id": "id-missing-fields-passport-6c033356", "where": "zoom-call:46fe9514b68a4617ae4faa100b20a8ab", "date": "2026-10-19", "url": ""}, {"tier": "LOW", "topic": "id-passport-military-id-firearm-purchase", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "A customer with no driver's license or state ID can be bought from using a passport, and probably a military ID. If both are offered, use whichever shows the most information.", "said": "You can use the passport and probably military ID.", "conflict": "", "correction": "", "note": "", "id": "id-passport-military-id-fire-1de0b39e", "where": "zoom-call:46fe9514b68a4617ae4faa100b20a8ab", "date": "2026-10-19", "url": ""}, {"tier": "LOW", "topic": "job-applicant-interview-inquiries", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When someone calls asking about an interview, the store tells them it will follow up by phone call if it is interested.", "said": "Told them if we are interested we will follow up via phone call", "conflict": "", "correction": "", "note": "", "id": "job-applicant-interview-inqu-8bbce9dc", "where": "#boro-funds (Chadd McClintic, Waynesboro manager)", "date": "2026-10-09", "url": "https://valleypawnworkspace.slack.com/archives/C03BLLRN64U/p1791582604693559"}, {"tier": "LOW", "topic": "new-location-site-selection-roanoke", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "George ruled out the Melrose buildings for a possible new Roanoke location because they were run down and too close to another pawn shop. Distance from competing pawn shops and building condition were factors in his judgment.", "said": "There are some building on Melrose but they are run down and too close to another pawn shop.", "conflict": "", "correction": "", "note": "", "id": "new-location-site-selection--b7007c38", "where": "#roanoke-funds (George Moore, Roanoke manager)", "date": "2026-10-09", "url": "https://valleypawnworkspace.slack.com/archives/C063K8E02TW/p1791570862911939"}, {"tier": "LOW", "topic": "no-fee-police-dept-transfer", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Do not charge the officer or police department a fee for this firearm transfer, since the delay was the store's fault. Preston said this about one deal.", "said": "just don't charge them. You know, make it, make it, you know, it's not a big deal, but don't charge them.", "conflict": "", "correction": "", "note": "", "id": "no-fee-police-dept-transfer-1d65b5b0", "where": "zoom-call:2026-10-12_0959_chadd-mcclintic_0857.txt", "date": "2026-10-12", "url": ""}, {"tier": "LOW", "topic": "out-of-policy-defective-buyback-offer", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When an item is outside the return policy and the store still wants to help, the fallback is to buy it back. Look up the market value of that item with the defect and make an offer, rather than refunding or swapping it.", "said": "I mean, the very least we can do is look up what one that has that defect has and make an offer and purchase it back.", "conflict": "", "correction": "", "note": "", "id": "out-of-policy-defective-buyb-185524bf", "where": "zoom-call:2026-08-29_HAR_store-to-Preston_14m42s.txt", "date": "2026-08-29", "url": ""}, {"tier": "LOW", "topic": "partial-refund-on-return-resale-discount", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a customer returns an item and the store agrees to sell it back at a lower price, the return can be done in part. Refund part in cash or credit and put the remainder back on the card. The speaker hedged (\"maybe\") and the speaker's role is not identified, so confirm with Preston before treating this as policy.", "said": "you can return part of it in cash. or credit and then put the other back on the card, maybe.", "conflict": "", "correction": "", "note": "", "id": "partial-refund-on-return-res-b6a103d4", "where": "zoom-call:977dbd23cc464aaebf05222ffcc6818f", "date": "2026-10-07", "url": ""}, {"tier": "LOW", "topic": "return-and-resell-partial-refund-method", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a customer returns an item and the store resells it to them at a discounted price, the refund can be split. Part goes back as cash or store credit and the rest to the card, or as a gift card. The speaker hedged (\"maybe\"), so confirm with Preston before relying on it.", "said": "you can return part of it in cash or store credit and then put the other back on the card maybe", "conflict": "", "correction": "", "note": "", "id": "return-and-resell-partial-re-20965e6f", "where": "zoom-call:2026-10-07_Preston-Zoom_to_Sandi_5m51s.txt", "date": "2026-10-07", "url": ""}, {"tier": "LOW", "topic": "return-outside-30-days-resize-option", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a customer wants to return a ring after the 30-day window because it doesn't fit, a free resize can be offered as an alternative to a refund. The speaker judged a sub-$100 repair cost acceptable for this.", "said": "it's sub $100, you know for us to probably get fixed. I'd be willing to do that on that room", "conflict": "", "correction": "", "note": "", "id": "return-outside-30-days-resiz-79f96827", "where": "zoom function runJob(j,text){
  post("preston","preston",text||j.say);
  var h=post("preston","gold",el("div","body typing","…"));
  setTimeout(function(){ replaceBody(h,textBody("Got it, Preston — on it. I will post back here as soon as it is done.")); },500);
  setTimeout(function(){
    var tags={ok:["ok","Proven"],ready:["ok","Ready"],warn:["warn","Goes to Joshua first"],no:["no",j.g]};
    var b=textBody(maskPhone(typeof j.reply==="function"?j.reply(text||j.say):j.reply)); b.append(el("div","note",j.ex?"How Claude answers this job today.":"Replayed from "+j.when+". Phone numbers hidden."));
    post("preston","claude",b,{tag:tags[j.st]});
    if(j.after) post("preston","sys",j.after);
    busy=false; $("send").disabled=false;
  },1500);
}
function matchJob(q){
  var order=JOBS.filter(function(j){return j.first;}).concat(JOBS.filter(function(j){return !j.first;}));
  for(var i=0;i<order.length;i++){var j=order[i]; if(j.re.test(q)&&(!j.re2||j.re2.test(q))&&!(j.not&&j.not.test(q))) return j;}
  return null;
}
function prestonSend(q){
  var j=matchJob(q);
  if(j){ runJob(j,q); return; }
  post("preston","preston",q);
  post("preston","sys","That isn't one of the proven jobs yet. In the live channel Claude still picks it up within a few minutes and works it end to end, but the list on the right is what has been done reliably and can be counted on. Store rules and how-to questions go in #ask-goldilocks.");
  busy=false; $("send").disabled=false;
}

function srcBlock(list){
  var d=el("details","srcs"); d.append(el("summary",null,"Where this comes from ("+list.length+")"));
  list.forEach(function(e){
    var s=el("div","src"); s.append(el("div","r",e.rule));
    var q=e.said.replace(/\s+/g," "); s.append(el("div","q","“"+(q.length>240?q.slice(0,237)+"…":q)+"”"));
    var m=el("div","m"); var tl={VERIFIED:["ok","Confirmed by Preston"],HIGH:["ok","His rule"],MEDIUM:["warn","One deal"],LOW:["no","One case"]}[e.tier];
    m.append(el("span","tag "+tl[0],tl[1])); if(e.conflict) m.append(el("span","tag conf","Conflict on record"));
    m.append(el("span",null,e.date+" · "+whereLabel(e.where)));
    if(e.url){var a=el("a",null,"Open in Slack ↗"); a.href=e.url; a.target="_blank"; a.rel="noopener"; m.append(a);}
    s.append(m); d.append(s);
  });
  return d;
}
function localBody(la){var b=el("div","body"); b.append(el("p","lead",la.lead)); if(la.items.length){var ul=el("ul"); la.items.forEach(function(t){ul.append(el("li",null,t));}); b.append(ul);} return b;}
function goldSend(q){
  post("gold","preston",q);
  var hadMath=pullMath(q), hits=search(q), refs=hits.slice(0,30);
  var la=hadMath?mathAnswer():localAnswer(hits);
  la.used.slice().reverse().forEach(function(n){ if(!refs.some(function(r){return r.i===n;})) refs.unshift({i:n,s:1}); }); refs=refs.slice(0,30);
  function finish(body,used){
    var ids=used.length?used:la.used; var list=ids.map(function(n){return E[n];});
    if(list.length) body.append(srcBlock(list));
    if(hadMath) body.append(el("div","note","Spot used: "+money(lastCalc.spot)+" ("+SPOT_ASOF+"). Melt is the floor, not an approved offer."));
    return body;
  }
  if(!sample){ post("gold","gold",finish(localBody(la),[])); busy=false; $("send").disabled=false; return; }
  var h=post("gold","gold",el("div","body typing","Goldilocks is reading "+refs.length+" of Preston's rules…"));
  var prompt=HARD+"\n\nQUESTION FROM THE STORE: "+q;
  if(hadMath&&lastCalc) prompt+="\n\nPAGE MELT CALCULATION (using Preston's formula): "+lastCalc.dwt+" dwt "+lastCalc.purity+" "+lastCalc.metal+" at spot "+money(lastCalc.spot)+" = melt "+money(lastCalc.melt)+". You may show this math.";
  prompt+="\n\nRECORDS:\n"+refs.map(function(r,k){return recordLine(E[r.i],k+1);}).join("\n\n");
  sample(prompt,{modelTier:"quick",cache:{gcTime:86400000},onText:function(u){replaceBody(h,textBody(u.text));}})
  .then(function(r){
    var m=r.text.match(/SOURCES?:\s*([0-9,\s]+)/i), used=[];
    if(m) m[1].split(/[,\s]+/).forEach(function(x){var k=parseInt(x,10); if(k>=1&&k<=refs.length&&used.indexOf(refs[k-1].i)<0) used.push(refs[k-1].i);});
    replaceBody(h,finish(textBody(r.text),used));
  })
  .catch(function(e){
    if(e&&/not_granted|sampling_disabled|not_declared|capability_disabled|capability_removed/.test(e.code)) sample=null;
    replaceBody(h,finish(localBody(la),[]));
  })
  .finally(function(){busy=false; $("send").disabled=false;});
}
