"correction": "", "note": "", "id": "vehicle-loan-judgment-c6a8137c", "where": "DM Joshua<->Preston", "date": "2023-10-24", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1698166027493609"}, {"tier": "LOW", "topic": "customer-confidence-introduce-background", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "To build customer comfort when the regular go-to person is out, staff should tell customers about their own experience and that they work together with that person.", "said": "let them know that you and Sandy work together", "conflict": "", "correction": "", "note": "", "id": "customer-confidence-introduc-8df0b0c9", "where": "zoom-call:2026-10-08_1225_Preston-to-JoshuaBurnett_8m57s.txt", "date": "2026-10-08", "url": ""}, {"tier": "LOW", "topic": "customer-loan-status-communication", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "Staff should tell customers accurately whether their collateral is still there, and should not tell them it is there and later reverse that. The goal is that customers know how to check their loan status and the store does not give them false hope.", "said": "I want them to know how to look at the loan and make sure it's there without giving them false open and then hitting them with up.", "conflict": "", "correction": "", "note": "", "id": "customer-loan-status-communi-41fae0a7", "where": "zoom-call:fa7bf71c53e84e369251149633ae9205", "date": "2026-10-20", "url": ""}, {"tier": "LOW", "topic": "expired-loan-reactivation-vs-scrap", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "When a customer with an expired loan has the money and is ready to reactivate it, try to reactivate rather than scrap the item. The speaker's reasoning is that the store earns more from ongoing loan payments, whereas an item can only be scrapped once.", "said": "if they but if they got money, they're ready to act and reactivate it. I feel like we should try to do that.", "conflict": "", "correction": "", "note": "", "id": "expired-loan-reactivation-vs-1bda7a80", "where": "zoom-call:fa7bf71c53e84e369251149633ae9205", "date": "2026-10-20", "url": ""}, {"tier": "LOW", "topic": "large-loan-secure-then-rewrite-workaround", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "On a large multi-item jewelry loan where the full amount can't be paid out today, write a partial loan to secure the goods. Screenshot the correct per-item costs first. The next day, redeem it with fees waived and rewrite it for the full amount so the item costs come out right. Securing the loan matters more than how the cost splits later.", "said": "write the loan and then you could do a redemption, wave all the fees tomorrow and then rewrite it for the full amount or something", "conflict": "", "correction": "", "note": "", "id": "large-loan-secure-then-rewri-5f9c1115", "where": "zoom-call:fe6c7f1f83114f2681c7d3048ecee956", "date": "2026-10-12", "url": ""}, {"tier": "LOW", "topic": "loan-add-money-cost-allocation", "section": "DEAL JUDGMENT, LOANS & APPROVALS", "rule": "When more money is added to an existing loan ticket, the system spreads the added cost evenly across all items on the ticket. It does not adjust each item's cost to where it should be.", "said": "No. It just like spreads it evenly across the ticket, which is really frustrating", "conflict": "", "correction": "", "note": "", "id": "loan-add-money-cost-allocati-7ecdcded", "where": "zoom-call:fe6c7f1f83114f2681c7d3048ecee956", "date": "2026-10-12", "url": ""}, {"tier": "HIGH", "topic": "buyer-network-elemetal", "section": "BUYER & VENDOR NETWORK", "rule": "Elemetal is Valley Pawn's gold and silver refiner. They issue prepaid shipping labels (not obtainable on Saturdays), and have been closed on some weekdays.", "said": "Good morning. I can get silver out Monday. Can't get a label from elemetal on Saturdays. It's ready though.", "conflict": "", "correction": "", "note": "", "id": "buyer-network-elemetal-5c6e61a2", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-05-30", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1780151302605529"}, {"tier": "HIGH", "topic": "buyer-network-elemetal-silver-rate", "section": "BUYER & VENDOR NETWORK", "rule": "Elemetal paid Valley Pawn 85% on the .925 silver lots.", "said": "It was all .925 what we did. Said they were doing 85%", "conflict": "Joshua in the same thread quotes an alternative schedule of \".925 & up - 90% return / Below .925 - 80% return\" from another (unnamed) group. Preston never confirmed which counterparty that schedule belonged to.", "correction": "", "note": "", "id": "buyer-network-elemetal-silve-14015ada", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-04-15", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1776259741661969"}, {"tier": "HIGH", "topic": "buyer-network-elemetal-silver-terms", "section": "BUYER & VENDOR NETWORK", "rule": "Elemetal's silver buyer spot-checks the lot; if it mostly looks good he runs the whole lot as .925, and only if he sees issues do they melt and assay before paying. Lots are split by flatware, knives, and jewelry.", "said": "He spot checked a bunch of it. Said if it mostly looks good he runs it as .925. If he sees issues then they melt it and do assay first before they pay us.", "conflict": "", "correction": "", "note": "", "id": "buyer-network-elemetal-silve-9d6216ca", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-04-15", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1776259949469059"}, {"tier": "HIGH", "topic": "buyer-network-elemetal-silver-throughput", "section": "BUYER & VENDOR NETWORK", "rule": "Elemetal caps silver intake at 250 troy ounces per calendar week (15.625 lbs).", "said": "Elemental is 250 ounces per calendar week. 15.625 pounds.", "conflict": "Two weeks earlier Preston reported the cap as \"15 pounds a week\" — \"The way he said they could take it is 15 pounds a week.\" (2026-04-15, https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1776259395432369). Capture both.", "correction": "", "note": "", "id": "buyer-network-elemetal-silve-a44b711b", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-04-28", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1777394427261499"}, {"tier": "HIGH", "topic": "buyer-network-local-gold-96-5", "section": "BUYER & VENDOR NETWORK", "rule": "A local counterparty (NEVER NAMED by Preston — referred to only as \"over there\") will pay 96.5% of spot on gold for a quick flip.", "said": "I called over there and they will give 96.5% of spot on the gold.", "conflict": "", "correction": "", "note": "", "id": "buyer-network-local-gold-96--e3f10632", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2025-06-10", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1749568831456689"}, {"tier": "MEDIUM", "topic": "buyer-network-elemetal-dispute", "section": "BUYER & VENDOR NETWORK", "rule": "Elemetal's regional rep accidentally slagged a Valley Pawn gold lot that still had stones in it; the settlement offered was $2,500 on top of melt plus a bump of the melt payout rate from 97% to 98%. Preston pushed to review the bucket SKUs and negotiate more.", "said": "They accidentally slagged our gold with stones. Want to give us $2500 on top of melt and bump the melt from 97% to 98%", "conflict": "", "correction": "", "note": "", "id": "buyer-network-elemetal-dispu-5382c302", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-08", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1780947578369769"}, {"tier": "MEDIUM", "topic": "buyer-network-elemetal-dispute", "section": "BUYER & VENDOR NETWORK", "rule": "The disputed lot's gold was worth $23,740.31 and Elemetal's offer including the slagging compensation was $26,486.", "said": "$23,740.31 was what the gold was worth. They want to give us 26,486 atm.", "conflict": "", "correction": "", "note": "", "id": "buyer-network-elemetal-dispu-881f9e90", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-08", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1780947757157609"}, {"tier": "MEDIUM", "topic": "buyer-network-rockys", "section": "BUYER & VENDOR NETWORK", "rule": "Rocky's is a local competing gold/silver buyer in the Valley Pawn market that customers shop against. Preston tracks whether a seller has \"been to Rocky's\" as a signal on a metals deal.", "said": "They said they are local, didn't go to Rocky's yet.", "conflict": "", "correction": "", "note": "", "id": "buyer-network-rockys-50b99eec", "where": "#boro-funds (C03BLLRN64U)", "date": "2024-05-17", "url": "https://valleypawnworkspace.slack.com/archives/C03BLLRN64U/p1715969157190569"}, {"tier": "HIGH", "topic": "aged-definition-one-year", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "\"Aged\" inventory means anything over 1 year old. Preston tracks it per store split into Jewelry and General Merch, each as a percent of the store's inventory base, plus a total aged percent.", "said": "AGED IS ANYTHING OVER 1 YEAR - MAKE SURE WE ARE REPRICING ITEMS TO CLEARANCE AND WORKING ON GETTING THIS STUFF OUT!!", "conflict": "", "correction": "", "note": "", "id": "aged-definition-one-year-a1aed82e", "where": "#aged-inventory-review", "date": "2025-11-10", "url": "https://valleypawnworkspace.slack.com/archives/C04NGH4FF35/p1762811748385319"}, {"tier": "HIGH", "topic": "appliances-new-in-box-only", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Generally don't take any appliance item unless it is brand new in the box, and it must still be tested.", "said": "Cuisinart toaster oven - Generally don't want any appliance items unless they are brand new in the box. Did we test?", "conflict": "", "correction": "", "note": "", "id": "appliances-new-in-box-only-32b0099a", "where": "#loans-and-buys", "date": "2024-04-18", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1713447001008929"}, {"tier": "HIGH", "topic": "assault-firearm-age-21", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Effective immediately under VA HB 1525 (emergency clause), no \"assault firearm\" may be transferred to a buyer under 21 — including a pawned item being redeemed. Interim rule: anything that is not a standard hunting rifle or shotgun is not transferable to under-21.", "said": "Team, effective immediately, we will not be able to transfer any \"assault firearms\" to buyers under the age of 21. Bill HB 1525 was signed into effect containing an \"emergency\" clause which puts this into effect immediately rather than July 1. \n\nI will work working on getting a breakdown on what is classified as an \"assault firearm\" to share with you all. For the time being, anything that is not a standard hunting rifle or shotgun we will not be able to transfer, even if it is a pawned item. \n\nIf you have any questions on this please reach out to me.", "conflict": "", "correction": "", "note": "", "id": "assault-firearm-age-21-cab2cae2", "where": "#compliance", "date": "2026-04-27", "url": "https://valleypawnworkspace.slack.com/archives/C04NZ3GGMPH/p1777315837971889"}, {"tier": "HIGH", "topic": "assault-firearm-exemptions", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Receivers are exempt from the assault-firearm ban and can still be transferred. Rimfire-ammo firearms are not included in the ban, but ammo capacity limits still apply.", "said": "Good morning everyone. Some additional clarification on the Assault Firearms.\n\nReceivers are exempt from the ban. We can still transfer those.\n\nRimfire ammo firearms are not included in the ban however ammo capacity limits do still apply.", "conflict": "", "correction": "", "note": "", "id": "assault-firearm-exemptions-79afd327", "where": "#compliance", "date": "2026-07-03", "url": "https://valleypawnworkspace.slack.com/archives/C04NZ3GGMPH/p1783083600779339"}, {"tier": "HIGH", "topic": "bows-crossbows-25-percent", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Bows and crossbows taken in off-season must be bought at 25% of current resale, because it's 8-9 months to season and the item could be worth half its current value by then.", "said": "Tenpoint stealth - $150 - Been seeing lots of bows and crossbows coming in at all stores. These are really difficult items for us to work with at this time of year. We need to get these CHEAP. 8-9 months before we will be back in season on these and we didn't sell through all of what we had going into the season as it is. Results in lots of money tied up. By cheap I mean 25% of current resell. Could be worth half of what it is now by next season.", "conflict": "", "correction": "", "note": "", "id": "bows-crossbows-25-percent-1c355633", "where": "#loans-and-buys", "date": "2024-01-30", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1706634811340329"}, {"tier": "HIGH", "topic": "bravo-price-guide-report", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Use the Bravo Price Guide report when pricing intake — it shows what other pawn shops are paying. A Glock 43x with $336 sold comps should have been bought at $250-275.", "said": "Glock 43x - $330 - Sold listings as low as $336. Should have gotten into this for $250-275. Make sure we use the Bravo Price Guide report. This shows what other pawn shops are paying as well!", "conflict": "", "correction": "", "note": "", "id": "bravo-price-guide-report-5941c1bf", "where": "#loans-and-buys", "date": "2024-01-13", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1705156200759969"}, {"tier": "HIGH", "topic": "broken-returns-location", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Returned items that cannot be sold go to a Bravo location called \"Broken,\" priced at cost, and staged in a designated back area until inventory, when they are written off and disposed of.", "said": "I have created a new location \"Broken\" for return items that cannot be sold. Please price these items at cost and designate an area for them in the back until we do inventory to write them off and dispose of them. \n\nPlease do this now and get your pricing list cleaned up.", "conflict": "", "correction": "", "note": "", "id": "broken-returns-location-be0165a0", "where": "#general", "date": "2024-03-21", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1711040015277089"}, {"tier": "HIGH", "topic": "c-grade-goods-ten-dollar-offer", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Never pay full value on a C-condition item even to build goodwill with a new customer. Make a $10 offer and use the moment to explain what we pay more for — no other shop will offer anything on it anyway.", "said": "Still can't pay full value on a C good item. Make a $10 offer and explain what we can pay more for. No other shop is going to make him an offer on it.", "conflict": "", "correction": "", "note": "", "id": "c-grade-goods-ten-dollar-off-8065cb7e", "where": "#loans-and-buys", "date": "2023-12-16", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1702738077350329"}, {"tier": "HIGH", "topic": "call-out-procedure", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Anyone calling out must phone Preston at 540-202-4200 at least 2 hours before their shift starts. If something prevents that, they must call as soon as they are able.", "said": "Everyone, if you are calling out, you need to physically call me at <tel:540-202-4200|540-202-4200> and tell me you will be out at least 2 hours before you are expected to be at work. If there is a situation that prevents that then you need to call me as soon as you are able to.", "conflict": "", "correction": "", "note": "", "id": "call-out-procedure-289787c3", "where": "#general (Preston Peters, Operations Manager)", "date": "2026-10-12", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1791814597546529"}, {"tier": "HIGH", "topic": "cant-test-dont-take", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Hard policy — if we can't test an item, we don't take it. If you want the item, find a way to test it.", "said": "Our policy is if we can't test it then we don't take it. If you want to take it then find a way to test it.", "conflict": "", "correction": "", "note": "", "id": "cant-test-dont-take-7a81ae6a", "where": "#loans-and-buys", "date": "2023-12-02", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1701530468311449"}, {"tier": "HIGH", "topic": "cash-drawer-policy", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Cash drawers must stay locked when not actively in use, keys may never be left in the lock, each employee owns drawer security on shift, and any loss/discrepancy is reported to management immediately.", "said": "Cash Drawer Policy\n• Cash drawers must remain locked at all times when not actively in use.\n\n• Keys may not be left in the lock of any cash drawer under any circumstances.\n\n• All employees are responsible for the security of the drawer during the shift.\n\n• Any loss, discrepancy, or security issue must be reported to management immediately.", "conflict": "", "correction": "", "note": "", "id": "cash-drawer-policy-2e43cefa", "where": "#policy-announcements", "date": "2026-02-24", "url": "https://valleypawnworkspace.slack.com/archives/C03BHQ9RLR0/p1771967402139769"}, {"tier": "HIGH", "topic": "clearance-aged-item-policy", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Full written aged/clearance SOP — jewelry over 1 year is separated, marked clearance, repriced 30% below the Bravo estimator price (firm), and scrapped at 2 years. General merchandise over 1 year goes to a labeled clearance section, keeps its original price tag, gets repriced in Bravo with a new \"Blowout\" tag, and the aged report is run and worked monthly.", "said": "Clearance/Aged Item Policy\n\nJewelry\n\nAll jewelry over 1 year old is to be separated from other jewelry in a very clear manner and marked as clearance.\n\nPrices are to be marked down on the tag (change the price) by 30% from the Bravo estimator price. This is the clearance price and the price is FIRM.\n\nOnce 2 years of age, this jewelry is to be scrapped.\n\n\nGeneral Merchandise\n\nAll general merchandise over 1 year old is to be separated into a clearance section that is clearly identifiable and labeled with our \"Clearance\" sign.\n\nOriginal price tag is to be kept on the item (Our original asking price)\n\nEach item is to be repriced in Bravo and a new tag is to be printed and placed onto one of our \"Blowout\" tags. This is the price we now intend to sell the item for.\n\nSave all the \"Blowout\" tags for reuse once an item sells.\n\n\nEvery month we need to run the new aged inventory report and pull and reprice all aged merchandise and move it to the clearance sections for both jewelry and general merchandise.", "conflict": "", "correction": "", "note": "", "id": "clearance-aged-item-policy-7a58088c", "where": "#general", "date": "2024-01-03", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1704290400624789"}, {"tier": "HIGH", "topic": "comp-methodology-sold-with-bids-used", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When comping value, only use sold listings that received at least one bid and are in used condition. Top-of-range prices assume brand new with the full kit.", "said": "$600 would have to be brand new with the hard case kit. Make sure you are looking at sold listings that received at least one bid and are used condition.", "conflict": "", "correction": "", "note": "", "id": "comp-methodology-sold-with-b-1233613d", "where": "#loans-and-buys", "date": "2024-03-21", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1711027800248029"}, {"tier": "HIGH", "topic": "consistent-rules-across-stores", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "All stores should operate under the same set of rules, so a customer gets the same answer on what is or isn't taken at every location.", "said": "I still want to have everybody operating under the same set of rules, essentially.", "conflict": "", "correction": "", "note": "", "id": "consistent-rules-across-stor-606a77b8", "where": "zoom-call:38fd73720bb342aeb12f016ed0618017", "date": "2026-10-12", "url": ""}, {"tier": "HIGH", "topic": "contacting-preston-by-message", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Message Preston through Slack, not by text.", "said": "go through slack. Not text.", "conflict": "", "correction": "", "note": "", "id": "contacting-preston-by-messag-df7cd1b2", "where": "#general (Preston Peters, Operations Manager)", "date": "2026-10-12", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1791814597546529"}, {"tier": "HIGH", "topic": "contacting-preston-by-phone", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "To reach Preston by phone, call 540-202-4200. He will not answer calls from any other number.", "said": "the phone number to CALL me is <tel:540-202-4200|540-202-4200>. I will not answer if it is not that number.", "conflict": "", "correction": "", "note": "", "id": "contacting-preston-by-phone-a32f5389", "where": "#general (Preston Peters, Operations Manager)", "date": "2026-10-12", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1791814597546529"}, {"tier": "HIGH", "topic": "custom-mods-dont-add-value", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Custom/aftermarket parts are hard to value and may mean nothing to the next buyer — price a modified item off the base model.", "said": "I will say it's hard to put a number on custom parts and that those parts may not mean anything to the next person.", "conflict": "", "correction": "", "note": "", "id": "custom-mods-dont-add-value-77b2669e", "where": "#deal-questions", "date": "2025-10-14", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1760459705504369"}, {"tier": "HIGH", "topic": "deal-questions-response-expectation", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Questions posted in #deal-questions are live deals at the counter 99% of the time; senior pawnbrokers are expected to answer as fast as possible.", "said": "PSA to everyone for this channel. Do your best to help out as soon as possible on these questions. These are active deals in front of us 99% of the time. Any of the senior pawnbrokers we have I encourage to respond.", "conflict": "", "correction": "", "note": "", "id": "deal-questions-response-expe-b5a98ef3", "where": "#deal-questions", "date": "2025-10-14", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1760459958351069"}, {"tier": "HIGH", "topic": "default-drivers-checklist", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Preston's seven named drivers of loan default: customer habits (loyalty report), loan-to-value ratio, payment management/contact, qualifying loan vs buy, testing merchandise, quality of the item, and proper contract closing. He tracks store-level TTM forfeit rate against these.", "said": "Loan forfeit rate TTM average comparison\n\nRoanoke - 45.44%\nWaynesboro - 36.59%\nLexington - 37.20%\nHarrisonburg - 29.12%\nCulpeper - 34.40%\n\nKey factors for loans that default\n\n• Customer's habits (loyalty report)\n• Loan to value ratio (is it worth them coming back for it?)\n• Loan payment management (Contacting customers to keep them paying)\n• Qualifying loan vs buy\n• Testing merchandise (Did it default because there are issues with the item?)\n• Quality of the item (throw away items, easily replaced, low value etc)\n• Contract closing (Closing a contract properly sets expectations and makes it real)", "conflict": "", "correction": "", "note": "", "id": "default-drivers-checklist-6ed5b920", "where": "#loans-and-buys", "date": "2023-11-10", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1699632000628529"}, {"tier": "HIGH", "topic": "dont-negotiate-with-yourself", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Never counter yourself. When a customer asks \"what can you do,\" respond by asking where they want to be or what they were looking to get.", "said": "I'm seeing a lot of us negotiating with ourselves. Remember, if they ask what we can do on something we should be responding by asking where they want to be at or how much they were looking get etc.", "conflict": "", "correction": "", "note": "", "id": "dont-negotiate-with-yourself-105090b9", "where": "#general", "date": "2026-02-07", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1770494873414999"}, {"tier": "HIGH", "topic": "ebay-costs-20-percent", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Selling on eBay costs about 20%, so keep desirable items in the store and push duplicates online. Guns and gold stick in the loan book, but variety brings in new customers both ways.", "said": "Remember everyone, guns and gold stick in the loan book but make sure we are open to other items. Variety creates new customers both ways. Talk about what we want to see and it will manifest. Move your duplicates on eBay to keep cash flowing and keep desirable items through the store rather than eBay so we don't lose 20%.", "conflict": "", "correction": "", "note": "", "id": "ebay-costs-20-percent-825cd38e", "where": "#general", "date": "2025-09-11", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1757599426838289"}, {"tier": "HIGH", "topic": "employee-purchase-metals-restriction", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Precious metals bullion and coins are named restricted categories under the Employee Purchase Policy Preston authored — they may be denied at management discretion regardless of the 30-day floor rule.", "said": "8. RESTRICTED CATEGORIES\n The following categories may be restricted or denied at management discretion:\n• Ammunition\n• Precious metals bullion\n• Coins\n• High-demand or limited-availability items", "conflict": "", "correction": "", "note": "", "id": "employee-purchase-metals-res-8ee531bb", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-02-06", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1770407755210729"}, {"tier": "HIGH", "topic": "employee-purchase-policy", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Full written Employee Purchase Policy — 30-day floor requirement, written request form, no self-pricing/self-approval/self-ringing, GM AND Owner approval required, no verbal or \"hookup\" pricing, extra firearms controls, and restricted categories.", "said": "EMPLOYEE PURCHASE POLICY\n1. PURPOSE\n The purpose of this policy is to allow limited employee purchases while protecting company inventory, maintaining consistent pricing standards, ensuring fairness to customers, and preserving regulatory and audit integrity.\nEmployee purchases are a privilege, not a guaranteed benefit, and are approved on a case-by-case basis.\n\n2. GENERAL POLICY STATEMENT\n All employee purchases must be requested and approved in advance using the Employee Purchase Request Form.\n There are no automatic approvals and no guaranteed purchase limits.\nApproval of one employee purchase does not guarantee approval of future purchases.\n\n3. ELIGIBILITY REQUIREMENTS\n To be eligible for employee purchase consideration, all of the following must be met:\n• The item must have been on the sales floor for a minimum of thirty (30) consecutive days\n• A completed Employee Purchase Request Form must be submitted\n• The employee may not price, approve, or ring their own purchase\n• Final pricing must be approved by both the General Manager and the Owner\n• Family or friend purchases initiated by an employee are treated as employee purchases\n• All purchases must comply with category-specific rules outlined below\nFailure to meet any requirement results in automatic denial.\n\n4. EMPLOYEE PURCHASE REQUEST FORM REQUIREMENTS\n Each request must include the following information:\n• Employee name and store location\n• Item description\n• Bravo inventory number / tag number\n• Inventory age (in days)\n• Store cost\n• Sticker / tagged retail price\n• Requested employee purchase price\nSubmission of a request does not guarantee approval.\n\n5. PRICING AUTHORITY\n Employee purchase pricing is determined exclusively by the General Manager and Owner.\nVerbal pricing approvals are not permitted.\n Informal, preferential, or \"hookup\" pricing is strictly prohibited.\nApproved pricing will be based on, but not limited to:\n• Store cost\n• Retail price\n• Current market conditions\n• Internal margin requirements\n• Inventory needs and optics\n\n6. PROCESSING AND SEPARATION OF DUTIES\n For all approved employee purchases:\n• The employee may not ring their own transaction\n• The employee may not approve their own transaction\n• A different employee must process the sale\n• A note must be entered in Bravo stating:\n \"Employee purchase – GM & Owner approved\"\n\n7. FIREARMS-SPECIFIC RULES\n Due to regulatory, audit, and optics considerations, firearm purchases are subject to additional controls:\n• Firearms must meet the 30-day sales floor requirement\n• All firearm purchases require GM and Owner approval\n• Another employee must complete the 4473\n• Employees may not place holds or reserve firearms prior to approval\n• All standard employee purchase pricing and documentation rules apply\nTransfers brought into the store for personal purchase are not considered store inventory and are not subject to this policy.\n\n8. RESTRICTED CATEGORIES\n The following categories may be restricted or denied at management discretion:\n• Ammunition\n• Precious metals bullion\n• Coins\n• High-demand or limited-availability items\nApproval may be denied based on inventory needs, customer demand, or optics.", "conflict": "", "correction": "", "note": "", "id": "employee-purchase-policy-7f21b60f", "where": "DM Joshua<->Preston", "date": "2026-02-06", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1770407755210729"}, {"tier": "HIGH", "topic": "employee-training-checklist", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Preston's full new-employee training checklist for store operations.", "said": "Employee Training Checklist\n\nEmployee Name:______________________ DATE______________\n\n\n\n• Pull list/pricing Training\n• eBay Listing\n• eBay Shipping\n• Customer Loyalty Analysis\n• Buying/Loaning Training\n• Firearms Safety Training\n• Firearms Paperwork/Sales Training\n• Payments and Redemption Training\n• Jewelry Testing\n• Diamond Grading\n• Pawn Contract Closing Training\n• Layaway and Warranty Policy Training\n• Sales Training\n• Opening Procedure\n• Closing Procedure", "conflict": "", "correction": "", "note": "", "id": "employee-training-checklist-4dd34ccd", "where": "#general", "date": "2024-01-03", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1704290400471849"}, {"tier": "HIGH", "topic": "ffl-receiving-sop", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Step-by-step Bravo procedure for receiving an inbound FFL transfer firearm.", "said": "Firearm comes in the mail, open box, get FFL info and receive in bravo. \n\nReceiving steps in bravo: inventory > stock management. Under receivings tab > add receiving. Select \"item inventory\" tab > add general merchandise. Enter make and model of firearm along with serial number. Set price to $0.01 and cost to $0.00. Save the item. Select the FFL vendor if already on file, create vendor profile if one does not already exist including business name and FFL number with expiration date. Save the transaction and print the tag", "conflict": "", "correction": "", "note": "", "id": "ffl-receiving-sop-4dede95e", "where": "DM Joshua<->Preston", "date": "2026-06-18", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1781789605301909"}, {"tier": "HIGH", "topic": "ffl-transfer-fee", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "FFL transfer fee is $25, or $25 for the first plus $10 for each additional firearm on the same transaction/paperwork.", "said": "$25 unless there are multiple transfers on the same transaction. Then it will be $25 for the first and $10 for each additional firearm.", "conflict": "", "correction": "", "note": "", "id": "ffl-transfer-fee-29e3aa7d", "where": "DM Joshua<->Preston", "date": "2026-06-25", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1782396590434249"}, {"tier": "HIGH", "topic": "first-payment-default-expire", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "First payment defaults should be expired. If the customer is a good one, call them and collect the payment instead. Customers already get automatic past-due and coming-due reminder texts every Friday, so non-payment is either the store allowing it or the customer choosing it.", "said": "Make sure we are working on getting these payments in and on time. First payment defaults should get expired. If it is on a good customer, call them and get that payment. Our customers get automatic reminder texts every Friday when they are past due as well as coming due. If they are not paying it is because we are allowing them to not pay or they are choosing not to. It's beneficial to all parties involved for payments to be on time!", "conflict": "", "correction": "", "note": "", "id": "first-payment-default-expire-97b309fa", "where": "#loans-and-buys", "date": "2025-03-28", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1743182926013799"}, {"tier": "HIGH", "topic": "game-disc-value-floor", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Old-gen game discs don't move in store and need to be worth $15-20+ each to be worth selling online.", "said": "PS3 games - $32 - Are these titles worth taking in? They don't move in store and need to be $15-20+ to be worth selling online.", "conflict": "", "correction": "", "note": "", "id": "game-disc-value-floor-3e13e033", "where": "#loans-and-buys", "date": "2025-01-28", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1738080005976169"}, {"tier": "HIGH", "topic": "games-written-up-separately", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Games must always be written up separately from the console, and must be documented (photographed, described, or written up individually).", "said": "The 64 has 0 documentation of games. Not pictured, in description, or written up separately. Games should always be written up separately from the system.", "conflict": "", "correction": "", "note": "", "id": "games-written-up-separately-f23d74f2", "where": "#loans-and-buys", "date": "2025-03-10", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1741620100715109"}, {"tier": "HIGH", "topic": "golf-clubs", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Golf clubs don't sell; unless they are a high-end brand (Ping, Callaway) worth eBaying, they are dead inventory — and they're seasonal going into winter.", "said": "Golf clubs - $25 - Are these Ping, Calloway or another high end brand? Golf clubs don't sell and if they aren't valuable enough to ebay they are dead inventory. Going into winter, seasonal items as well. Looks like a new customer, did we tell them what items we are looking to take in?", "conflict": "", "correction": "", "note": "", "id": "golf-clubs-766180ed", "where": "#loans-and-buys", "date": "2023-10-09", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1696858200291529"}, {"tier": "HIGH", "topic": "gun-safety-clear-before-handing", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Every firearm must be safely cleared before being handed to a customer, every single time, no exceptions.", "said": "Remember, if we are showing gun to a customer that you are to clear it safely before handing it to the customer every single time! No exceptions!", "conflict": "", "correction": "", "note": "", "id": "gun-safety-clear-before-hand-0137bef9", "where": "#general", "date": "2026-02-02", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1770058324667459"}, {"tier": "HIGH", "topic": "gun-safety-training-mandatory", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "All employees must complete Basic Gun Safety 101 ($25 certificate version) at gunsafetytrainingpro.com during work hours, print the certificate, submit it to Preston, and are reimbursed via petty cash payout.", "said": "All employees are required to complete the Basic Gun Safety 101 training course through the following provider:\nhttps://gunsafetytrainingpro.com/product/basic-gun-safety-101-online-class/\nPlease be sure to select and complete the $25 certificate version of the course.\nImportant details:\nThe course must be completed during normal work hours.\nThe program is broken into sections and may be completed in multiple sessions.\nOnce finished, print the completion certificate and submit it to me.\n• Employees will be reimbursed via petty cash payout upon submission of the printed certificate.\nCompletion of this training is mandatory.", "conflict": "", "correction": "", "note": "", "id": "gun-safety-training-mandator-2bdf7a22", "where": "#policy-announcements", "date": "2026-03-02", "url": "https://valleypawnworkspace.slack.com/archives/C03BHQ9RLR0/p1772465400755619"}, {"tier": "HIGH", "topic": "handbags-name-brands-only", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Only take name-brand handbags — the brand is what sells them.", "said": "3 unbranded handbags - $30 - Make sure we are sticking to the name brands for these. The brand is what sells them.", "conflict": "", "correction": "", "note": "", "id": "handbags-name-brands-only-fde45aef", "where": "#loans-and-buys", "date": "2024-04-16", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1713274201788949"}, {"tier": "HIGH", "topic": "hard-to-sell-in-store-means-buy-cheaper", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "An item that is almost impossible to sell in store and will only move on eBay must be bought cheaper than a normal-margin item.", "said": "Hilti DXE72 - $100 - Should have got this for less. They are almost impossible to sell in store and will be an ebay sale item. Sold listings for as low as $150.", "conflict": "", "correction": "", "note": "", "id": "hard-to-sell-in-store-means--197743db", "where": "#loans-and-buys", "date": "2024-02-26", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1708957801822929"}, {"tier": "HIGH", "topic": "high-end-watch-caution-ask-preston", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Be very careful with high-end watches. If unsure about any higher-end brand, contact Preston for his opinion before buying.", "said": "The solution is to be very careful when you deal with high-end watches and make sure that we don't make that mistake in the future. And if you have to reach out and ask my opinion from me on any kind of higher-end brand, then I encourage that.", "conflict": "", "correction": "", "note": "", "id": "high-end-watch-caution-ask-p-a5fec63a", "where": "zoom-call:9cdd3d517430447eb25c621de7e7a115", "date": "2026-10-17", "url": ""}, {"tier": "HIGH", "topic": "icloud-account-removal", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Standing daily check on every Apple item (iPad, iPhone-adjacent, MacBook, iMac, Apple Watch, AirPods Max) — iCloud, password, and \"Find My\" must be removed before intake; Apple Watches must be synced to the phone to verify. Same rule applies to DJI drones (must be unlinked from the previous owner's DJI account).", "said": "Apple ipad - did we remove icloud and password?\n\nApple watch - did we remove icloud?", "conflict": "", "correction": "", "note": "", "id": "icloud-account-removal-ce3d9928", "where": "#loans-and-buys", "date": "2024-02-12", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1707748203886979"}, {"tier": "HIGH", "topic": "intake-vs-pricing-capacity", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a store's pricing backlog grows, Preston diagnoses it as an intake-vs-bandwidth mismatch, not laziness — the fix is a third workstation/employee, with overtime or a pause on intake as temporary measures only.", "said": "The Waynesboro pricing issue is just not enough bandwidth from what I can tell. We either have to dial back intake so we can price or find another person so we can have 3 and open 6 days. There is not a lack of pricing getting done, intake is just too high to sustain.", "conflict": "", "correction": "", "note": "", "id": "intake-vs-pricing-capacity-eb42b4ba", "where": "DM Joshua<->Preston", "date": "2026-08-11", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1786469692204989"}, {"tier": "HIGH", "topic": "kids-licensed-and-sports-games", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Pass on Disney Infinity / Skylanders / old Madden-type titles — we already have countless of these aged out across multiple locations, and old sports games almost always age out and don't sell.", "said": "PS3 games - disney infinity, skylanders, madden 25 - these games we should just pass on. We have countless of these already aged out at multiple locations across the company.", "conflict": "", "correction": "", "note": "", "id": "kids-licensed-and-sports-gam-a2c1ee35", "where": "#loans-and-buys", "date": "2023-11-27", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1701095400610139"}, {"tier": "HIGH", "topic": "layaway-cancellation-in-store-only", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Use layaway cancellation only when the customer requests it in the store. It immediately gives store credit for the amount paid, which can be used in the current transaction or put on a gift card for later.", "said": "Layaway cancellation is only used when the customer request the cancellation in the store. Layaway cancellation will immediately give Store credit in the amount that was paid towards the layaway that can be used in the current transaction or placed on a gift card for later use. This option is only to be used when the customer is in the store.", "conflict": "", "correction": "", "note": "", "id": "layaway-cancellation-in-stor-92e4b879", "where": "#preston-claude (Preston Peters, Operations Manager)", "date": "2026-10-14", "url": "https://valleypawnworkspace.slack.com/archives/C0BGXSTT4TY/p1791995450477079?thread_ts=1791995450.477079&cid=C0BGXSTT4TY"}, {"tier": "HIGH", "topic": "layaway-expiration-60-days", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Expire any layaway with no payment for 60 days. Expiration automatically issues store credit equal to the amount paid, and the customer should be notified so they can use it later.", "said": "Any layaway without payment for 60 days is to be expired. Upon expiration Store credit is automatically issued to the customers account in the amount that was paid towards the layaway. Customers should be notified about the Store credit so that they can use it at a later time.", "conflict": "", "correction": "", "note": "", "id": "layaway-expiration-60-days-254db36d", "where": "#preston-claude (Preston Peters, Operations Manager)", "date": "2026-10-14", "url": "https://valleypawnworkspace.slack.com/archives/C0BGXSTT4TY/p1791995450477079?thread_ts=1791995450.477079&cid=C0BGXSTT4TY"}, {"tier": "HIGH", "topic": "layaway-refund-store-credit-only", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Layaway cancellations and expirations are refunded only as store credit. Any other form of refund needs Preston Peters' approval.", "said": "All cancellations and expirations are only issued in the form of Store credit unless otherwise approved by Preston Peters.", "conflict": "", "correction": "", "note": "", "id": "layaway-refund-store-credit--6396ddd7", "where": "#preston-claude (Preston Peters, Operations Manager)", "date": "2026-10-14", "url": "https://valleypawnworkspace.slack.com/archives/C0BGXSTT4TY/p1791995450477079?thread_ts=1791995450.477079&cid=C0BGXSTT4TY"}, {"tier": "HIGH", "topic": "layaway-store-credit-on-expiration", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Layaway policy was updated in the system to issue store credit on expiration. Employee permissions were also loosened to include renewals for everyone plus higher amount limits and multiple firearm transactions.", "said": "I have revised permissions to include renewals for everyone. I have also loosened up some things that should help lessen the amount of approvals that will need to be requested. Some of things include amount limits, and multiple firearm transactions. \n\nLayaway policy has also been updated in the system to issue store credit on expiration as well.", "conflict": "", "correction": "", "note": "", "id": "layaway-store-credit-on-expi-82b71dc4", "where": "#general", "date": "2025-02-10", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1739216592452009"}, {"tier": "HIGH", "topic": "lithium-only-battery-tools", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Any battery-powered tool must be lithium; everything else is obsolete or problematic with high return risk. Non-lithium batteries can show a full charge and die within minutes or seconds of use.", "said": "Paslode 900600 nailer - $75 -  Did we test this? Did we test the batteries? This is not the lithium battery model. If it is a battery powered tool then it needs to be lithium. Everything else is essentially obsolete or problematic with high return risk. Problem with non-lithium batteries is that they can be charging and show a full charge, but die in a matter of minutes or even seconds of use.", "conflict": "", "correction": "", "note": "", "id": "lithium-only-battery-tools-cf9a53c5", "where": "#loans-and-buys", "date": "2023-10-09", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1696858200291529"}, {"tier": "HIGH", "topic": "loose-tools-brand-whitelist", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The only loose (non-set) hand tools we should take are Snap-on, Matco, and Mac.", "said": "Loose sockets - $12 - Only loose tools we should be taking are Snap-on, Matco, Mac.", "conflict": "", "correction": "", "note": "", "id": "loose-tools-brand-whitelist-212c3a42", "where": "#loans-and-buys", "date": "2024-03-28", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1711632600565619"}, {"tier": "HIGH", "topic": "markdown-aggressiveness-even-at-a-loss", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "On heavily aged general merchandise, increase the markdown amount even if it means taking a loss. Jewelry over 1.5 years should be getting scrapped each month, and clearance jewelry needs its own clearly separate section.", "said": "Aged inv - Waynesboro and Lexington need more focus on moving GM aged out. Verify items have been tagged and moved to aged, increase markdown amount on heavily aged items even if it is a loss.-- Waynesboro jewelry looks to be in a great spot. Indicates good management or scrapping items before the 1.5 year mark. – Roanoke has highest jewelry percent, ensure clearance has its own section and easily identifiable from other jewelry. Verify all aged items over 1.5 years are getting scrapped each month.", "conflict": "The written Clearance/Aged Item Policy (2024-01-03) says jewelry is scrapped at 2 years; here Preston uses a 1.5-year scrap mark.", "correction": "", "note": "", "id": "markdown-aggressiveness-even-1f350410", "where": "DM Joshua<->Preston", "date": "2026-05-11", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1778509712947879"}, {"tier": "HIGH", "topic": "markdown-deadline-15th", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Aged markdowns are a monthly task and must be completed before the 15th of each month.", "said": "Are these markdowns complete now? These should be completed before the 15th of each month.", "conflict": "", "correction": "", "note": "", "id": "markdown-deadline-15th-3a3da18a", "where": "#aged-inventory-review", "date": "2025-10-27", "url": "https://valleypawnworkspace.slack.com/archives/C04NGH4FF35/p1761578452975349"}, {"tier": "HIGH", "topic": "markdown-definition", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "\"Aged markdowns completed\" means every aged item is repriced AND physically moved to clearance — not just repriced.", "said": "Who has completed aged markdowns for this month? This means all items repriced moved to clearance.", "conflict": "", "correction": "", "note": "", "id": "markdown-definition-55e8d461", "where": "#aged-inventory-review", "date": "2025-05-19", "url": "https://valleypawnworkspace.slack.com/archives/C04NGH4FF35/p1747685235064469"}, {"tier": "HIGH", "topic": "metals-policy-signoff", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "There is a signed Gusto policy covering precious metals melt calculations that all staff acknowledged in Feb 2026.", "said": "Good morning!!! I sent out another policy that needs a signature on gusto for precious metals melt calculations. Please sign that as soon as you can.", "conflict": "", "correction": "", "note": "", "id": "metals-policy-signoff-f777a443", "where": "#policy-announcements (C03BHQ9RLR0)", "date": "2026-02-26", "url": "https://valleypawnworkspace.slack.com/archives/C03BHQ9RLR0/p1772117100970139"}, {"tier": "HIGH", "topic": "muzzleloader-condition-checks", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "We don't typically take muzzleloaders at all; if one is taken, the bore must be perfectly clean with no corrosion and the gun must be confirmed unloaded.", "said": "Knight muzzleloader - $70 - Don't typically take muzzloaders. Is the bore on this perfectly clean with no corrosion? Did we make sure it is not still loaded?", "conflict": "", "correction": "", "note": "", "id": "muzzleloader-condition-check-c7e52594", "where": "#loans-and-buys", "date": "2023-10-06", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1696599000811809"}, {"tier": "HIGH", "topic": "muzzleloaders-40-percent", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Muzzleloaders cannot be valued like normal firearms — offer 40% of resale. In the cited case a $155 sold-comp muzzleloader should have been $75 max against a $125 offer. They are seasonal, sell poorly, and we have no competition on them.", "said": "Traditions pursuit xt muzzleloader- $125 - No sold listings on gunbroker for this - listings as low as $225 with no bids. Truegunvalue has sold listings for $155 with scopes included. We can't treat muzzleloaders the same as normal firearms. They do not sell as well and are seasonal. Should be offering 40% on these. No one else is taking them so we have no competition. Should have been at $75 max on this.", "conflict": "", "correction": "", "note": "", "id": "muzzleloaders-40-percent-2eabf5f3", "where": "#loans-and-buys", "date": "2024-03-04", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1709562600925689"}, {"tier": "HIGH", "topic": "negotiate-every-deal", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Every deal is to be negotiated. Preston estimates failure to negotiate costs the company more than $100,000 and likely more than $200,000 a year.", "said": "Remember we are all pawnbrokers. We should be negotiating every deal to the best we can. We miss out on more than $100,000 a year easily by not trying to negotiate likely more than $200,000! That's money that can be put back into the company and employees! The little dollars add up to very big dollars.", "conflict": "", "correction": "", "note": "", "id": "negotiate-every-deal-50552460", "where": "#general", "date": "2025-12-05", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1764951026336229"}, {"tier": "HIGH", "topic": "negotiation-first-to-speak", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "On the sales side, whoever speaks first on price sets the pace — get an offer from the customer since we already have a price tag; use the 30-day warranty as negotiating weight instead of discounting for condition.", "said": "• Negotiating\n    ◦ First to speak on the price sets the pace of the deal\n        ▪︎ Get an offer from the customer first, we already have a price tag!\n        ▪︎ Our warranty carries weight when negotiating so that you don't have to discount as much for condition", "conflict": "", "correction": "", "note": "", "id": "negotiation-first-to-speak-1e155808", "where": "#general", "date": "2023-12-18", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1702908015893249"}, {"tier": "HIGH", "topic": "negotiation-script-line", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Preston's scripted line for deflecting a \"what can you do\" price question back to the customer.", "said": "You can respond with \"I really don't like to negotiate with myself but I'm happy to entertain an offer if you have one\\", "conflict": "", "correction": "", "note": "", "id": "negotiation-script-line-5a62dd77", "where": "#general", "date": "2026-02-07", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1770495557215709"}, {"tier": "HIGH", "topic": "never-recommend-competitors", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Never recommend a competitor to customers, including Facebook Marketplace. If a customer asks where else they could sell an item, say we don't know.", "said": "There is never a scenario where we should be recommending a competitor of any kind to our customers. *This includes Facebook marketplace.* \n\nIf they ask where they might be able to sell it we tell them we don't know.", "conflict": "", "correction": "", "note": "", "id": "never-recommend-competitors-9b313c90", "where": "#general (Preston Peters, Operations Manager)", "date": "2026-10-09", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1791580466061079"}, {"tier": "HIGH", "topic": "nicd-reason", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The stated reason for the NiCd refusal.", "said": "Just a reminder to everyone, the reason we don't take the NiCd battery items is because it is dated technology and most all of the batteries available are no longer good.", "conflict": "", "correction": "", "note": "", "id": "nicd-reason-1c6e9241", "where": "#loans-and-buys", "date": "2023-12-26", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1703603151967719"}, {"tier": "HIGH", "topic": "no-cell-phones", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Valley Pawn does not take cell phones — Preston flagged their appearance in the website's top-10 electronics list as an error.", "said": "Has cell phones in the top 10 electronic items which we don't take.", "conflict": "", "correction": "", "note": "", "id": "no-cell-phones-69b1c71a", "where": "DM Joshua<->Preston", "date": "2026-06-23", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1782220794915009"}, {"tier": "HIGH", "topic": "no-competition-means-buy-cheaper", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When no other shop in the area takes a merchandise category, we have zero competition and should be negotiating far below the offer, not paying near retail.", "said": "2 wooden dove decoys - $150 - Are we negotiating to get this kind of stuff as cheap as possible? No one else is taking this kind of merchandise in the area so we have 0 competition. Should be able to get much cheaper!", "conflict": "", "correction": "", "note": "", "id": "no-competition-means-buy-che-b667df18", "where": "#loans-and-buys", "date": "2024-02-12", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1707748203886979"}, {"tier": "HIGH", "topic": "no-dvds", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Get away from taking DVDs; if a store needs DVD inventory there are thousands in Roanoke available to transfer.", "said": "98 DVDs - $49 - We need to get away from DVDs. If you need inventory for these we have thousands available in Roanoke that we can transfer.", "conflict": "", "correction": "", "note": "", "id": "no-dvds-f7301c29", "where": "#loans-and-buys", "date": "2024-03-28", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1711632600565619"}, {"tier": "HIGH", "topic": "no-nicd-battery-tools", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "We do NOT take NiCd-battery tools of any kind — the technology is dated and nearly all available batteries are no longer good. Battery tools must be lithium.", "said": "Paslode Nailer - $60 - is this a lithium battery model? Remember we do not take NiCd battery tools.\n\nCraftsman Drill - $25 - Is this a NiCd battery tool? We do NOT take NiCd battery anything.", "conflict": "", "correction": "", "note": "", "id": "no-nicd-battery-tools-961b1295", "where": "#loans-and-buys", "date": "2023-12-26", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1703601001129839"}, {"tier": "HIGH", "topic": "no-phone-cases", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Never take phone cases of any sort — they sit and age out almost always.", "said": "Otterbox case for iphone 6 - Definitely don't want to take in phone cases of any sort. They sit and age out almost always. This is for an obsolete device as well.", "conflict": "", "correction": "", "note": "", "id": "no-phone-cases-8390cf37", "where": "#loans-and-buys", "date": "2024-07-09", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1720535400878619"}, {"tier": "HIGH", "topic": "no-splitting-items-to-recover-cost", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Do not split an item into parts (e.g., separating loose cases) to recover cost on a bad buy. Manipulating an item's cost is not acceptable.", "said": "We don't ever want to manipulate an items cost that just it's not good", "conflict": "", "correction": "", "note": "", "id": "no-splitting-items-to-recove-bc269d48", "where": "zoom-call:9cdd3d517430447eb25c621de7e7a115", "date": "2026-10-17", "url": ""}, {"tier": "HIGH", "topic": "no-sunglasses", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Preston does not want sunglasses as a category — they have performed badly for the company independent of authenticity concerns.", "said": "I don't want sunglasses", "conflict": "", "correction": "", "note": "", "id": "no-sunglasses-3a694d68", "where": "#deal-questions", "date": "2025-10-18", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1760807811815219"}, {"tier": "HIGH", "topic": "non-working-items-refused", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "If an item is not working, we don't take it. (Case: a battery-powered item with a dead battery — only worth ~$40 once a battery is installed and it is confirmed working.)", "said": "If it's not working then we don't take it. If they put a battery in it and it works probably around $40", "conflict": "", "correction": "", "note": "", "id": "non-working-items-refused-412bbe54", "where": "#deal-questions", "date": "2025-10-28", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1761662895361199"}, {"tier": "HIGH", "topic": "old-sports-games", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Avoid old sports game titles — they age out and don't sell.", "said": "Madden NFL 16 - We want to avoid the old sports games, they usually always age out and don't sell.", "conflict": "", "correction": "", "note": "", "id": "old-sports-games-20887100", "where": "#loans-and-buys", "date": "2024-02-13", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1707834604742049"}, {"tier": "HIGH", "topic": "over-5-percent-means-expire", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When a store crosses 5% of loan base past 75 days, the remedy is expiration, not more waiting.", "said": "Percent of Loan Base Past 75 Days - 5.8% - Expirations need to happen here. This is over our 5% we can work with.", "conflict": "", "correction": "", "note": "", "id": "over-5-percent-means-expire-a0622175", "where": "#loans-and-buys", "date": "2025-01-25", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1737836982465509"}, {"tier": "HIGH", "topic": "overpaying-math", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Overpaying by just $30 a day at each store costs the company $40k a year. Margin opportunity is created at the counter on intake, not later.", "said": "Make sure we are buying and loaning right! Overpaying by just $30 a day at each store costs us 40k a year! Don't be afraid to negotiate. The profit margin opportunity is set at the counter when we take it in.", "conflict": "", "correction": "", "note": "", "id": "overpaying-math-c3625353", "where": "#general", "date": "2025-01-25", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1737816475733739"}, {"tier": "HIGH", "topic": "past-due-75-day-5-percent-ceiling", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Dollars on loans past due more than 75 days must stay under 5% of the store's total loan balance. Above 5% Preston orders expirations; 3.9-4.8% gets a \"creeping to 5%\" warning.", "said": "Percent of Loan Base Past 75 Days - 4.8 % - Need to look to tighten this up!\n18 items in first payment default. Should be looking to expire these.\n\n\nThis percent needs to be less than 5% of the loan balance.", "conflict": "", "correction": "", "note": "", "id": "past-due-75-day-5-percent-ce-30eeab0b", "where": "#loans-and-buys", "date": "2026-02-09", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1770673097798459"}, {"tier": "HIGH", "topic": "past-due-calls-are-phone-calls", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Past-due collection contact means actual phone calls, not texts or messages — customers already get those automatically.", "said": "Remember, these are PHONE calls. Not texts or messages. They already get those automatically.", "conflict": "", "correction": "", "note": "", "id": "past-due-calls-are-phone-cal-aef1d760", "where": "#general", "date": "2025-10-06", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1759758087746239"}, {"tier": "HIGH", "topic": "pawn-redemption-not-negotiable", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Pawn redemption amounts cannot be negotiated.", "said": "It's $2,679 to reactivate and redeem. We can't negotiate the pawn redemption.", "conflict": "", "correction": "", "note": "", "id": "pawn-redemption-not-negotiab-f3fb40a4", "where": "#lex-funds", "date": "2026-03-16", "url": "https://valleypawnworkspace.slack.com/archives/C03B3K5DL6T/p1773671561147559"}, {"tier": "HIGH", "topic": "pre-open-30-minutes", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The 30 minutes before opening is the most productive block of the day and has a defined task list.", "said": "30 minutes before we are opening. How are you using that time? Open store, ship items, pricing list, respond to eBay, chekkit, bravo messages, expire loans that are past due/make phone calls to customers, set goals for the day with your team, pawn walk to review items from previous day, etc. This should be the most productive 30 minutes of your day!", "conflict": "", "correction": "", "note": "", "id": "pre-open-30-minutes-6a7c6338", "where": "#general", "date": "2026-02-12", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1770908205375769"}, {"tier": "HIGH", "topic": "price-tag-visibility", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When putting items out for sale, the tag must be visible on the shelf and not hidden.", "said": "So when you put things out for sale, you always want to be able to see the tag when it's on the shelf. So you don't want it hide and things like that.", "conflict": "", "correction": "", "note": "", "id": "price-tag-visibility-f2ddf434", "where": "zoom-call:2026-10-08_1207_Preston-to-JacobCox_9m48s.txt", "date": "2026-10-08", "url": ""}, {"tier": "HIGH", "topic": "pricing-list-zero-daily", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The pricing list goal is zero by the end of every day — unpriced items can't be sold because they aren't on the floor. eBay and Facebook Marketplace are the fallback activity when foot traffic is slow.", "said": "Good morning everyone. Make sure we are sales focused. Lots of cash going out lately not as much coming in. Every action we take should be in the interest of getting cash in the door. Get out from behind the counters and greet the customers. Make sure someone is always available to sell. eBay and Facebook marketplace should be a primary focus when sales foot traffic is slow. Pricing list goal is always 0 by the end of the day, we can't sell it if it's not out on the floor.", "conflict": "", "correction": "", "note": "", "id": "pricing-list-zero-daily-6a09a94e", "where": "#general", "date": "2025-10-23", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1761227587852179"}, {"tier": "HIGH", "topic": "refund-and-warranty-policy", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "30-day warranty on sales. Refunds: first 7 days cash back; after 7 days store credit only.", "said": "2. Refund policy is 30 days warranty - first 7 days cash back, after 7 days is store credit.", "conflict": "", "correction": "", "note": "", "id": "refund-and-warranty-policy-2e0df63d", "where": "DM Joshua<->Preston", "date": "2026-07-14", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1784039155417799"}, {"tier": "HIGH", "topic": "routers", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The only router we should take is a high-end gaming router; standard routers don't sell in store and don't bring enough to sell online.", "said": "Arris Router - $6.50 - Not really an item worth taking in. Doesn't sell in-store and doesn't bring enough to sell online. Only router we should take is a high-end gaming one.", "conflict": "", "correction": "", "note": "", "id": "routers-cd7e510a", "where": "#loans-and-buys", "date": "2024-02-17", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1708182000870259"}, {"tier": "HIGH", "topic": "selling-gold-below-melt", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Preston objects to automated aged-inventory markdowns being applied to gold, because they can push listed gold below melt once fees are factored in.", "said": "I'm worried about selling gold under melt", "conflict": "", "correction": "", "note": "", "id": "selling-gold-below-melt-9530f858", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-07-04", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1783194754252569"}, {"tier": "HIGH", "topic": "selling-gold-below-melt", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Same thread — his caution on blanket eBay markdowns touching gold.", "said": "I'd be careful with that. Some of it is gold and I'm not sure what it's priced at already to factor in fees.", "conflict": "", "correction": "", "note": "", "id": "selling-gold-below-melt-bb7d764b", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-07-04", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1783194679205429"}, {"tier": "HIGH", "topic": "transfer-firearm-accounting", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Transfer firearms carry $0.00 cost, are priced at $0.01 (Bravo won't allow $0.00), sold for $0.00, and the NICS fee is charged in the transaction. Transfer revenue lands in \"Retail Sales (Tax Exempt-Other)\" on EOD, counted as revenue but not as sales. Report path: View/Void transactions > Custom Reports > \"Claude NICS transfers.\"", "said": "For firearm transfers:\n\nTransfer firearms have $0.00 cost and are priced at $.01, sold for $0.00 and are charged a NICS fee in the transaction.", "conflict": "", "correction": "", "note": "", "id": "transfer-firearm-accounting-de0edaef", "where": "DM Joshua<->Preston", "date": "2026-06-16", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1781629550464459"}, {"tier": "HIGH", "topic": "unsupported-apple-devices", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Don't take Apple devices Apple no longer supports with updates — specifically Apple Watch Series 3, even on a reloan.", "said": "Apple watch series 3 - I see this is a reloan but apple is no longer supporting this model with updates so we should not be taking them in.", "conflict": "", "correction": "", "note": "", "id": "unsupported-apple-devices-f885c85d", "where": "#loans-and-buys", "date": "2024-01-27", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1706365800723639"}, {"tier": "HIGH", "topic": "vacuums-new-in-box-only", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Vacuums are not an item we need to take unless new in box — there is plenty of other inventory to work with instead.", "said": "Bissel pet pro vacuum - $15 - This is not an item we need to take in unless it is new in box. Plenty of other inventory we can work with instead of this.", "conflict": "", "correction": "", "note": "", "id": "vacuums-new-in-box-only-50e2cfee", "where": "#loans-and-buys", "date": "2023-11-10", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1699626600129519"}, {"tier": "HIGH", "topic": "vintage-ammo", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "We will take vintage ammo as long as it has been stored properly and is in good condition — but don't pay extra for it.", "said": "As long as they have been stored properly and in good condition. Don't pay extra for them or anything.", "conflict": "", "correction": "", "note": "", "id": "vintage-ammo-ba04681c", "where": "#deal-questions", "date": "2025-10-18", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1760803725888509"}, {"tier": "HIGH", "topic": "vintage-camera-lenses", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Vintage camera lenses are tough to resell; if it isn't worth more than $20 on eBay it isn't worth messing with.", "said": "3 Vintage camera lenses - Vintage camera lenses can be tough to resell. If it isn't worth more than $20 on ebay then it's not going to be worth messing with.", "conflict": "", "correction": "", "note": "", "id": "vintage-camera-lenses-2a4c305a", "where": "#loans-and-buys", "date": "2024-04-19", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1713533400151109"}, {"tier": "HIGH", "topic": "warranty-requires-account-with-email", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "The 30-day warranty requires the customer to have an account with an email on file to qualify. New accounts must be set up for buying customers as well as loaning customers.", "said": "We had the lowest amount of new customer accounts I have seen last week across all stores. \n\nRemember that the warranty REQUIRES an account with an EMAIL to be qualified. \n\nNew accounts should be setup for our buying customers as well as our loaning customers!", "conflict": "", "correction": "", "note": "", "id": "warranty-requires-account-wi-4db3aad0", "where": "#general", "date": "2025-08-19", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1755622571690899"}, {"tier": "HIGH", "topic": "warranty-used-items-no-indefinite", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Valley Pawn does not give open-ended warranties on used items. Coverage is limited to the stated return/warranty window.", "said": "I mean, we can't have a warranty that lasts indefinitely on used items.", "conflict": "", "correction": "", "note": "", "id": "warranty-used-items-no-indef-c59a6554", "where": "zoom-call:2026-08-29_HAR_store-to-Preston_14m42s.txt", "date": "2026-08-29", "url": ""}, {"tier": "HIGH", "topic": "wclm-four-pitch-points", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Every customer must be told about all four: Warranty, Clearance, Layaway, Mobile app (\"WCLM\"). This is Preston's daily standing reminder.", "said": "Remember, every customer needs to be told about warranty, clearance, layaway and mobile app!", "conflict": "", "correction": "", "note": "", "id": "wclm-four-pitch-points-d52db07b", "where": "#general", "date": "2026-02-13", "url": "https://valleypawnworkspace.slack.com/archives/C03BETSS669/p1770994489321899"}, {"tier": "HIGH", "topic": "website-calculator-accuracy", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "As of June 2026 the public website coin calculator was estimating 70-80% (too high vs what Valley Pawn pays), and the \"sell your jewelry\" and \"sell your silver\" gold calculators were not working at all.", "said": "Looks like there is still issues, coins are still estimating high and silver and jewelry ones aren't working. Same as before", "conflict": "", "correction": "", "note": "", "id": "website-calculator-accuracy-44c701be", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-23", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1782230459978469"}, {"tier": "HIGH", "topic": "website-calculator-accuracy", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Preston quantified \"high\" on the coin calculator as 70-80%.", "said": "High is 70-80%", "conflict": "", "correction": "", "note": "", "id": "website-calculator-accuracy-1f729507", "where": "DM Joshua<->Preston (D03C7RBGY56)", "date": "2026-06-23", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1782236059750689"}, {"tier": "HIGH", "topic": "weekly-store-review-metrics", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Preston's weekly per-store review criteria: aged inventory percent (17.1% flagged as needing big focus), past-due loans percent (4.3% flagged as needing work before 5%), layaway payments, items-to-price backlog, returns dollars, eBay volume, and sales trend vs prior months.", "said": "Harrisonburg\n\nTotal aged at 17.1% need big focus on moving this aged out. More aggressive markdowns and effort through eBay.\n\nNeed to get some layaway payments in. Tied for most layaways needing payments.\n\nPast due loans at 4.3% need to work on this list to make sure it doesn't get to 5%. Make calls, get customers in.\n\nReturns killing us with $1,202.91 for the week. Need to make sure sales are locked in to prevent returns for buyers remorse etc.", "conflict": "", "correction": "", "note": "", "id": "weekly-store-review-metrics-c70da4b1", "where": "DM Joshua<->Preston", "date": "2026-06-23", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1782225330374839"}, {"tier": "HIGH", "topic": "xbox-360-console-refuse", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Generally don't take the original Xbox 360 console — nearly 60% failure rate from overheating causing the red ring defect. Xbox 360 games don't sell well either. HP/printers are very hard to sell and test — only work with them if brand new.", "said": "Xbox 360 games - $30 - how many games did we take in? Does not show the quantity. 360 games don't sell well, did we overpay on these?\n\nXbox 360 original console - did we FULLY test? This model has a VERY high failure rate (nearly 60%) of overheating and causing a red ring defect. Generally don't want to take this model.\n\nHP printer - $20 - Printers are very hard to sell as well as test. Usually only want to work with them if they are brand new.", "conflict": "", "correction": "", "note": "", "id": "xbox-360-console-refuse-3cb1f4c7", "where": "#loans-and-buys", "date": "2024-04-26", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1714143910033159"}, {"tier": "MEDIUM", "topic": "acid-test-18k-fade-rate", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "When acid testing 18k gold, the reaction should fade slowly, not quickly. A fast fade means the piece is not holding up as 18k.", "said": "Test with acid at 18k should fade slow and not fast", "conflict": "", "correction": "", "note": "", "id": "acid-test-18k-fade-rate-f8c00124", "where": "#deal-questions (Preston Peters, Operations Manager)", "date": "2026-10-09", "url": "https://valleypawnworkspace.slack.com/archives/C03BWGT5F5X/p1791577698262159"}, {"tier": "MEDIUM", "topic": "aged-over-two-years", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Preston separately tracks inventory aged over 2 years by store and treats it as must-move: identify, mark down, and get it gone.", "said": "Aged over 2 years\n\nCulpeper - $742.98\nHarrisonburg - $1,407.09\nLexington - $1,162.43\nRoanoke - $2,404.88\nWaynesboro - $1,816.06\n\nThis stuff has got to get marked down and moved out. Has everyone finished identifying these items and pricing them to get gone?", "conflict": "", "correction": "", "note": "", "id": "aged-over-two-years-e48e0b69", "where": "#aged-inventory-review", "date": "2025-05-27", "url": "https://valleypawnworkspace.slack.com/archives/C04NGH4FF35/p1748363420926549"}, {"tier": "MEDIUM", "topic": "authenticity-verification-required", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "High-counterfeit-risk brands must be verified before intake — Preston names Benchmade knives and Gibson guitars specifically and asks what steps were taken.", "said": "Gibson ES 135 - $400 - Are we sure this is not a counterfeit? What steps did we take to verify authenticity?", "conflict": "", "correction": "", "note": "", "id": "authenticity-verification-re-eee4a5f7", "where": "#loans-and-buys", "date": "2024-02-24", "url": "https://valleypawnworkspace.slack.com/archives/C03GBDKSLRE/p1708781400000000"}, {"tier": "MEDIUM", "topic": "big-toy-buy-judgment", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Example of Preston's big-toy buy judgment: buy a Polaris 4-wheeler with title at $2,500 against a $4,200 sticker and expected $3,800+ realization (~60-66% of expected sale price), justified by fast turn in the Lexington market.", "said": "I have a customer from Lexington wanting to sell this 4 wheeler for $2500. He has the title for it. It's a Polaris with just 300 miles on it. It's a regular customer. We would price it at around $4200 and likely get $3800+. I think it would be a good item to pickup and would sell quickly. They are super popular especially in the Lexington area. He was originally wanting 3500 and I have got him to this number but don't think I can get him any lower.", "conflict": "", "correction": "", "note": "", "id": "big-toy-buy-judgment-73dfd153", "where": "DM Joshua<->Preston", "date": "2024-03-28", "url": "https://valleypawnworkspace.slack.com/archives/D03C7RBGY56/p1711659629959749"}, {"tier": "MEDIUM", "topic": "call-out-notice-two-hours", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "An employee calling out must physically call the manager/Preston at least two hours before their shift starts. The policy is written in the handbook.", "said": "you're supposed to call me two hours before shift starts. Physically call me", "conflict": "", "correction": "", "note": "", "id": "call-out-notice-two-hours-789173d1", "where": "zoom-call:aebe1af2b4a541ddbf5669fe7f782d67", "date": "2026-10-12", "url": ""}, {"tier": "MEDIUM", "topic": "call-out-policy-notice", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Employees who will miss a shift must physically call Preston at least two hours before the shift starts, as soon as they know. The policy is written in the handbook.", "said": "you're supposed to call me two hours before shift starts. Physically call me", "conflict": "", "correction": "", "note": "", "id": "call-out-policy-notice-0eddd12a", "where": "zoom-call:2026-10-12_0956_walker-tapley_0302.txt", "date": "2026-10-12", "url": ""}, {"tier": "MEDIUM", "topic": "call-out-verbal-notice-required", "section": "OTHER OPERATIONAL KNOWLEDGE", "rule": "Calling out requires verbally telling Preston or a manager. Telling a coworker or sending a text is not enough, and a no-call/no-show is unacceptable.", "said": "I need you to verbally say, you won't be in or calling out.", "conflict": "", "correction": "", "note": "", "id": "call-out-verbal-no
